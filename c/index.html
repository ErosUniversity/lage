<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>unc · Founder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Permanent+Marker&display=swap">
  <style>
    /* C · Founder: shitposty, lowercase everything, stickers on graph paper, group chat */
    :root {
      --paper: #fffaf0;
      --ink: #111;
      --muted: #6b665c;
      --lime: #c6ff3d;
      --orange: #ffb35c;
      --pink: #ff9ad5;
      --sky: #8fd3ff;
      --lilac: #c9b6ff;
      --yellow: #ffe14d;
      --mint: #8ff0c0;
      --coral: #ff8a7a;
      --blue: #2f7bff;
      --sans: "Bricolage Grotesque", system-ui, sans-serif;
      --marker: "Permanent Marker", "Comic Sans MS", cursive;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(17, 17, 17, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17, 17, 17, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
      font-size: 15px;
      line-height: 1.35;
      text-transform: lowercase;
    }
    button, textarea { font: inherit; color: inherit; text-transform: inherit; }
    button, a { cursor: pointer; }
    a { text-decoration: none; color: inherit; }
    :focus { outline: none; }
    :focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
    .sr {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
    }

    .c-lime { --c: var(--lime); }
    .c-orange { --c: var(--orange); }
    .c-pink { --c: var(--pink); }
    .c-sky { --c: var(--sky); }
    .c-lilac { --c: var(--lilac); }
    .c-yellow { --c: var(--yellow); }
    .c-mint { --c: var(--mint); }
    .c-coral { --c: var(--coral); }

    .app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; }

    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 26px;
      padding: 22px 18px 18px;
      background: var(--ink);
      color: var(--paper);
    }
    .brand-kicker { margin: 0; font: 400 38px/1 var(--marker); color: var(--lime); transform: rotate(-3deg); transform-origin: left; }
    .brand-kicker span { display: block; margin-top: 6px; font: 600 12px var(--sans); color: rgba(255, 250, 240, 0.6); }
    .brand-name { margin: 14px 0 0; font-size: 17px; font-weight: 800; }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .seg button {
      border: 2px solid var(--paper);
      border-radius: 999px;
      background: none;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .seg button:hover { background: rgba(255, 250, 240, 0.12); }
    .seg button[aria-selected="true"] { background: var(--lime); border-color: var(--lime); color: var(--ink); transform: rotate(-2deg); }

    nav { display: flex; flex-direction: column; gap: 16px; }
    .group { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
    .group-label { margin: 0 0 2px; font: 400 15px var(--marker); color: var(--pink); }
    .nav-btn { padding: 3px 6px; margin-left: -6px; font-size: 16px; font-weight: 700; border-radius: 6px; }
    .nav-btn:hover { background: rgba(255, 250, 240, 0.12); }
    .nav-btn[aria-current="page"] { background: var(--lime); color: var(--ink); transform: rotate(-1.5deg); }
    .note { margin-top: auto; font-size: 12px; font-weight: 600; color: rgba(255, 250, 240, 0.5); }

    main { min-width: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .ticker { overflow: hidden; background: var(--lime); border-bottom: 2.5px solid var(--ink); }
    .ticker-track { display: inline-flex; white-space: nowrap; animation: ticker 32s linear infinite; }
    .ticker-track span { padding: 7px 0; font-size: 13px; font-weight: 800; }
    .ticker-track span::after { content: "✦"; margin: 0 16px; }
    @keyframes ticker { to { transform: translateX(-50%); } }
    .topbar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--ink);
      color: var(--paper);
    }
    .topbar strong { font-size: 18px; font-weight: 800; }
    .menu-btn { border: 2px solid var(--paper); border-radius: 999px; background: none; padding: 4px 12px; font-weight: 700; }
    .stage { padding: 30px 32px 48px; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 34px;
      align-items: start;
      max-width: 1260px;
      margin: 0 auto;
    }
    .frame { min-width: 0; }

    .hey { margin: 0; font-size: clamp(34px, 5vw, 52px); font-weight: 800; line-height: 1; letter-spacing: -0.035em; }
    .sub {
      display: inline-block;
      margin: 12px 0 30px;
      padding: 2px 8px;
      background: var(--yellow);
      font: 400 21px var(--marker);
      transform: rotate(-1.5deg);
    }

    /* stickers */
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-flow: dense; gap: 24px 22px; }
    .sticker {
      container-type: inline-size;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 190px;
      padding: 14px 16px 16px;
      background: var(--c);
      border: 2.5px solid var(--ink);
      border-radius: 18px;
      box-shadow: 5px 5px 0 var(--ink);
      transform: rotate(var(--tilt, 0deg));
      transition: transform 140ms ease, box-shadow 140ms ease;
    }
    .sticker:hover { transform: rotate(0deg) translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
    .sticker { position: relative; }
    .sticker-l { grid-column: span 2; grid-row: span 2; }
    .sticker-l .num { font-size: min(120px, 24cqi); }
    .sticker-l .two .num { font-size: min(104px, 22cqi); }
    .sticker-l .what { font-size: 16px; }
    .sticker-l .mood { font-size: 28px; }
    .sticker-m { grid-column: span 2; }
    .two .what b { white-space: normal; }
    .sticker-s .two { grid-template-columns: 1fr; gap: 10px; }
    .sticker-s .two .num { font-size: min(46px, 19cqi); }
    .stamp {
      position: absolute;
      top: -13px;
      right: 14px;
      padding: 2px 9px;
      background: var(--ink);
      color: var(--paper);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      transform: rotate(4deg);
    }
    .sticker-l .stamp {
      top: -18px;
      padding: 4px 13px;
      background: var(--lime);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      font-size: 19px;
      transform: rotate(-5deg);
    }
    .label {
      align-self: flex-start;
      padding: 3px 10px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
    }
    .num {
      display: block;
      font-size: min(46px, 19cqi);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .two .num { font-size: min(46px, 10cqi); }
    .what { display: block; margin-top: 6px; font-size: 13px; font-weight: 600; }
    .what b { display: inline-block; margin-top: 3px; padding: 0 6px; background: var(--ink); color: var(--paper); border-radius: 6px; font-weight: 700; white-space: nowrap; }
    .what b.up::before { content: "↑ "; color: var(--lime); }
    .what b.down::before { content: "↓ "; color: var(--coral); }
    .mood { margin-top: auto; font: 400 18px/1.1 var(--marker); transform: rotate(-2deg); transform-origin: left; }

    /* detail */
    .sheet {
      container-type: inline-size;
      padding: 22px 24px 26px;
      background: #fff;
      border: 2.5px solid var(--ink);
      border-radius: 22px;
      box-shadow: 6px 6px 0 var(--ink);
    }
    .back { display: inline-block; margin-bottom: 14px; font-size: 14px; font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .sheet h1 { margin: 0; font-size: clamp(36px, 6vw, 56px); font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
    .scribble { margin: 10px 0 0; font: 400 26px var(--marker); color: #e0352b; transform: rotate(-2deg); transform-origin: left; }
    .bigs { display: flex; flex-wrap: wrap; gap: 18px 40px; margin-top: 22px; }
    .big { padding: 12px 16px; background: var(--c); border: 2.5px solid var(--ink); border-radius: 16px; }
    .big .num { font-size: min(72px, 15cqi); }
    .tldr { margin: 22px 0 0; max-width: 56ch; font-size: 16px; font-weight: 600; }
    .tldr b { padding: 1px 6px; margin-right: 4px; background: var(--yellow); }
    .sheet h2 { margin: 30px 0 0; font: 400 22px var(--marker); }
    table { width: 100%; margin-top: 18px; border-collapse: collapse; }
    .sheet h2 + table { margin-top: 8px; }
    th { text-align: left; font-size: 12px; font-weight: 800; padding: 0 0 8px; border-bottom: 2.5px solid var(--ink); }
    td { padding: 11px 16px 11px 0; border-bottom: 2px dashed rgba(17, 17, 17, 0.35); vertical-align: top; font-size: 15px; font-weight: 500; }
    td.num, th.num { text-align: right; padding-right: 0; font-weight: 800; }
    tr:last-child td { border-bottom: 0; }

    /* group chat */
    .chat-panel {
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      height: min(660px, calc(100vh - 90px));
      overflow: hidden;
      background: #fff;
      border: 2.5px solid var(--ink);
      border-radius: 22px;
      box-shadow: 6px 6px 0 var(--ink);
    }
    .chat-head { display: flex; flex-direction: column; padding: 12px 16px; background: var(--ink); color: var(--paper); }
    .chat-head span { font-size: 17px; font-weight: 800; }
    .chat-head small { font-size: 12px; font-weight: 600; color: rgba(255, 250, 240, 0.6); }
    .thread { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: auto; padding: 14px; }
    .thread:empty::before { content: "ask me anything. cash, fires, clout, side quests."; font: 400 20px/1.2 var(--marker); color: #bdb7aa; transform: rotate(-1.5deg); }
    .msg-user, .msg-agent { max-width: 82%; padding: 8px 13px; border-radius: 18px; font-size: 14px; font-weight: 500; }
    .msg-user { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 5px; }
    .msg-agent { align-self: flex-start; background: #ececee; border-bottom-left-radius: 5px; }
    .msg-agent::before { content: "lage bot 🤖"; display: block; margin-bottom: 2px; font-size: 11px; font-weight: 800; color: var(--muted); }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      margin: 0 10px 10px;
      padding: 3px 3px 3px 14px;
      border: 2.5px solid var(--ink);
      border-radius: 24px;
    }
    textarea {
      flex: 1;
      border: 0;
      resize: none;
      background: transparent;
      padding: 9px 0;
      line-height: 22px;
      max-height: 110px;
      min-height: 40px;
      font-weight: 600;
    }
    textarea::placeholder { color: #9a958a; }
    .icon-btn {
      width: 38px; height: 38px; flex: none;
      display: grid; place-items: center;
      border: 0; border-radius: 50%;
      background: transparent;
    }
    .icon-btn:hover { background: #f1eee6; }
    .icon-btn[aria-pressed="true"] { background: var(--coral); }
    #send { background: var(--lime); border: 2px solid var(--ink); }
    #send:disabled { background: #e9e6de; border-color: #c9c4b8; color: #9a958a; }
    .icon-btn svg { width: 16px; height: 16px; display: block; }
    .icon-btn svg path, .icon-btn svg rect { stroke-width: 2; }

    .backdrop { display: none; }

    @media (max-width: 1100px) {
      .workspace { grid-template-columns: minmax(0, 1fr) 300px; gap: 26px; }
      .stage { padding: 24px 22px 40px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sticker-l, .sticker-m { grid-column: span 2; }
      .sticker-l { grid-row: auto; min-height: 260px; }
    }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .topbar { display: flex; }
      .rail {
        position: fixed;
        z-index: 4;
        width: min(300px, 88vw);
        transform: translateX(-105%);
        transition: transform 160ms ease;
      }
      .rail.open { transform: none; }
      .backdrop.show { display: block; position: fixed; inset: 0; z-index: 3; background: rgba(17, 17, 17, 0.5); }
      .stage { padding: 20px 16px 32px; }
      .workspace { grid-template-columns: 1fr; gap: 32px; }
      .grid { gap: 18px 14px; }
      .sticker { min-height: 160px; padding: 12px 13px 14px; transform: rotate(calc(var(--tilt, 0deg) / 2)); }
      .chat-panel { position: static; height: 500px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none; }
      .rail, .sticker { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="../brand.css">
  <script src="../brand.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="rail" id="rail">
      <div class="brand">
        <p class="brand-kicker"><span class="unc-logo" data-unc="wordmark" style="--unc-h: 34px"></span><span>(pre-seed energy)</span></p>
        <p class="brand-name" id="company">Heft &amp; Bogen</p>
        <div class="seg" role="tablist" aria-label="Betrieb">
          <button type="button" role="tab" data-pack="buch" aria-selected="true">bookshop 📚</button>
          <button type="button" role="tab" data-pack="software" aria-selected="false">saas 💻</button>
          <button type="button" role="tab" data-pack="event" aria-selected="false">events 🪩</button>
        </div>
      </div>
      <nav aria-label="Bereiche">
        <div class="group">
          <a class="nav-btn" href="#home">the vibe ✨</a>
        </div>
        <div class="group">
          <p class="group-label">status</p>
          <a class="nav-btn" href="#finance">cash 💸</a>
          <a class="nav-btn" href="#tickets">fires 🔥</a>
        </div>
        <div class="group">
          <p class="group-label">growth</p>
          <a class="nav-btn" href="#social">clout 📈</a>
          <a class="nav-btn" href="#conversion">conversion 🛒</a>
          <a class="nav-btn" href="#retention">they came back 🫶</a>
        </div>
        <div class="group">
          <p class="group-label">do stuff</p>
          <a class="nav-btn" href="#messages">dms 📬</a>
          <a class="nav-btn" href="#management">team 🫡</a>
          <a class="nav-btn" href="#todo">side quests 🗡️</a>
        </div>
      </nav>
      <p class="note">fake data, real feelings</p>
      <button class="om-sound" type="button" data-om-sound data-on="sound on 🔊" data-off="sound off 🔇" aria-pressed="false">sound off 🔇</button>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <main>
      <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>
      <div class="topbar">
        <button class="menu-btn" type="button" id="menu">menu</button>
        <span class="unc-logo" data-unc="mark" style="--unc-h: 22px"></span><strong id="top-company">Heft &amp; Bogen</strong>
      </div>
      <div class="stage">
        <div class="workspace">
          <div class="frame" id="stage"></div>
          <aside class="chat-panel" aria-label="Chat">
            <div class="chat-head"><span>founders 🧃</span><small>3 members</small></div>
            <div class="thread" id="thread" aria-live="polite" data-om-chime=".msg-agent"></div>
            <form class="composer" id="composer">
            <label class="sr" for="msg">Nachricht</label>
            <textarea id="msg" rows="1" placeholder="Nachricht schreiben"></textarea>
            <button class="icon-btn" type="button" id="mic" aria-label="Mikrofon" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <rect x="6" y="1.5" width="4" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="M4 8.2a4 4 0 0 0 8 0M8 12.2v2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="icon-btn" type="submit" id="send" aria-label="Senden" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 13V3.5M8 3.5 4.2 7.2M8 3.5l3.8 3.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
          </aside>
        </div>
      </div>
    </main>
  </div>
  <script>
    const ORDER = ["finance", "tickets", "social", "conversion", "retention", "messages", "management", "todo"];
    const GROUPS = { finance: "Lage", tickets: "Lage", social: "Wachstum", conversion: "Wachstum", retention: "Wachstum", messages: "Handeln", management: "Handeln", todo: "Handeln" };

    function tile(id, category, value, metric, delta, sign, line, also) {
      return { id, category, value, metric, delta, sign, line, also: also || null };
    }
    function sheet(headers, rows, numeric) {
      return { headers, rows, numeric };
    }

    // change: relative Veränderung je Bereich, bestimmt die Kachelgröße. Aus den Kacheln abgeleitet;
    // für Nachrichten, Management und To-do sind die Vorwerte ausgedacht.
    const DATA = {
      buch: {
        company: "Heft & Bogen",
        change: { finance: 0.052, tickets: 0.5, social: 0.12, conversion: -0.067, retention: 0.033, messages: 0.4, management: 0.25, todo: 0 },
        tiles: {
          finance: tile("finance", "Finance", "42.800 €", "Liquide Mittel", "+2.100 €", "up", "42.800 € liquide Mittel, 2.100 € über dem Vormonat."),
          tickets: tile("tickets", "Tickets & Probleme", "6", "Überfällige Fälle", "2 seit gestern", "", "6 Fälle sind über der Frist. 2 Probleme sind kritisch. Eines ist der fehlende Nachtzug.", { value: "2", metric: "Kritisch und offen", delta: "1 in der Lieferkette", sign: "" }),
          social: tile("social", "Social Media", "18.400", "Reichweite, 7 Tage", "+12 %", "up", "Reichweite der letzten 7 Tage: 18.400, davon 12.100 auf Instagram."),
          conversion: tile("conversion", "Conversion", "4,2 %", "Käufe je Besuch", "−0,3 Punkte", "down", "4,2 % der Besuche wurden ein Kauf. 52 Käufe aus 1.240 Besuchen."),
          retention: tile("retention", "Retention", "31 %", "Zweitkauf in 90 Tagen", "+1 Punkt", "up", "31 % der Käufer haben in 90 Tagen ein zweites Mal gekauft."),
          messages: tile("messages", "Nachrichten", "14", "Ungelesen", "3 Konten", "", "14 Nachrichten sind ungelesen."),
          management: tile("management", "Management", "5", "Überfällige Aufgaben", "älteste 4 Tage", "", "5 delegierte Aufgaben sind über der Frist."),
          todo: tile("todo", "To-do", "3", "Wichtig und dringend", "von 11 Punkten", "", "3 eigene Punkte sind wichtig und dringend.")
        },
        sheets: {
          finance: sheet(["Konto", "Stand"], [["Geschäftskonto", "38.200 €"], ["Kasse", "4.600 €"], ["Lieferanten, fällig in 14 Tagen", "6.400 €"]], [1]),
          tickets: sheet(["Fall", "Frist", "Kanal"], [["Abholung Nachtzug", "2 Tage über", "Laden"], ["Karton Suhrkamp", "1 Tag über", "Verlag"], ["Rechnung Müller", "heute", "Laden"], ["Schulbestellung", "4 Tage über", "Schule"]], []),
          problems: sheet(["Quelle", "Sache"], [["Lieferkette", "Nachtzug, Verlag liefert nicht"], ["Server", "Shop langsam seit 6 Minuten"]], []),
          social: sheet(["Kanal", "Reichweite"], [["Instagram", "12.100"], ["Facebook", "6.300"]], [1]),
          conversion: sheet(["Stufe", "Anzahl"], [["Besuche", "1.240"], ["Reservierungen", "86"], ["Käufe", "52"]], [1]),
          retention: sheet(["Kohorte", "Zweitkauf"], [["Juni", "28 %"], ["Juli", "33 %"], ["August", "31 %"]], [1]),
          messages: sheet(["Konto", "Von", "Inhalt"], [["Laden", "Frau Kehl", "Ist der Nachtzug da?"], ["Verlag", "Suhrkamp", "Neuer Termin 28.10."], ["Intern", "Lena", "Bestand ist geprüft"]], []),
          management: sheet(["Aufgabe", "Person", "Status"], [["Lagermeldung", "Lena", "Ausstehend"], ["Schaufenster", "Tim", "Angefangen"], ["Inventur Krimi", "Lena", "Ausstehend"], ["Kasse zählen", "Tim", "Beendet"]], []),
          todo: sheet(["Feld", "Punkt"], [["Wichtig und dringend", "Verlag anrufen"], ["Wichtig und dringend", "Schulbestellung klären"], ["Wichtig und dringend", "Kassensturz"], ["Wichtig und nicht dringend", "Herbstprogramm"], ["Nicht wichtig und dringend", "Schaufensterfolie"], ["Nicht wichtig und nicht dringend", "Altbestand sichten"]], [])
        }
      },
      software: {
        company: "Nordkap",
        change: { finance: -0.055, tickets: 0.571, social: 0.06, conversion: 0.063, retention: -0.011, messages: -0.25, management: 0.4, todo: -0.333 },
        tiles: {
          finance: tile("finance", "Finance", "310.000 €", "Liquide Mittel", "−18.000 €", "down", "310.000 € liquide Mittel, 18.000 € unter dem Vormonat."),
          tickets: tile("tickets", "Tickets & Probleme", "11", "Überfällige Fälle", "4 seit gestern", "", "11 Supportfälle sind über der Antwortfrist. 1 Problem ist kritisch: die API antwortet seit 40 Minuten mit Fehlern.", { value: "1", metric: "Kritisch und offen", delta: "API seit 40 Minuten", sign: "down" }),
          social: tile("social", "Social Media", "62.000", "Reichweite, 7 Tage", "+6 %", "up", "Reichweite der letzten 7 Tage: 62.000, auf der LinkedIn-Seite."),
          conversion: tile("conversion", "Conversion", "17 %", "Test zu zahlend", "+1 Punkt", "up", "17 % der Testkonten wurden zahlend. 31 von 180."),
          retention: tile("retention", "Retention", "94 %", "Noch zahlend nach 90 Tagen", "−1 Punkt", "down", "94 % der zahlenden Kunden zahlen nach 90 Tagen noch."),
          messages: tile("messages", "Nachrichten", "9", "Ungelesen", "3 Konten", "", "9 Nachrichten sind ungelesen."),
          management: tile("management", "Management", "7", "Überfällige Aufgaben", "älteste 6 Tage", "", "7 delegierte Aufgaben sind über der Frist."),
          todo: tile("todo", "To-do", "2", "Wichtig und dringend", "von 8 Punkten", "", "2 eigene Punkte sind wichtig und dringend.")
        },
        sheets: {
          finance: sheet(["Posten", "Betrag"], [["Geschäftskonto", "310.000 €"], ["Löhne, diese Woche", "42.000 €"], ["Hosting, diese Woche", "1.800 €"]], [1]),
          tickets: sheet(["Fall", "Frist", "Kanal"], [["Login, API-Fehler", "3 Stunden über", "Support"], ["Export bricht ab", "1 Tag über", "Support"], ["Rechnung Holm", "heute", "Firma"], ["Testkonto ohne Mail", "2 Tage über", "Support"]], []),
          problems: sheet(["Quelle", "Sache"], [["Produkt", "API antwortet seit 40 Minuten mit Fehlern"]], []),
          social: sheet(["Kanal", "Reichweite"], [["LinkedIn", "62.000"]], [1]),
          conversion: sheet(["Stufe", "Anzahl"], [["Testkonten", "180"], ["Aktiviert", "96"], ["Zahlend", "31"]], [1]),
          retention: sheet(["Kohorte", "Noch zahlend"], [["Juli", "96 %"], ["August", "94 %"], ["September", "94 %"]], [1]),
          messages: sheet(["Konto", "Von", "Inhalt"], [["Support", "Kunde Holm", "Export bricht ab"], ["Firma", "Steuerbüro", "Lohnunterlagen"], ["Intern", "Mira", "Fix liegt auf Staging"]], []),
          management: sheet(["Aufgabe", "Person", "Status"], [["API-Fix", "Mira", "Angefangen"], ["Kundeninfo Holm", "Jonas", "Ausstehend"], ["Lohn freigeben", "Jonas", "Ausstehend"], ["Staging prüfen", "Mira", "Beendet"]], []),
          todo: sheet(["Feld", "Punkt"], [["Wichtig und dringend", "API-Lage entscheiden"], ["Wichtig und dringend", "Lohn freigeben"], ["Wichtig und nicht dringend", "Preisliste Q4"], ["Nicht wichtig und dringend", "Statusseite aktualisieren"]], [])
        }
      },
      event: {
        company: "Atelier Süd",
        change: { finance: 0.095, tickets: 0.333, social: -0.04, conversion: 0.083, retention: 0.067, messages: 0.467, management: 0, todo: 1 },
        tiles: {
          finance: tile("finance", "Finance", "96.500 €", "Liquide Mittel", "+8.400 €", "up", "96.500 € liquide Mittel, 8.400 € über dem Vormonat."),
          tickets: tile("tickets", "Tickets & Probleme", "4", "Überfällige Fälle", "1 seit gestern", "", "4 Rückfragen sind über der Frist. 3 Probleme sind kritisch. Location und Licht betreffen diese Woche.", { value: "3", metric: "Kritisch und offen", delta: "2 betreffen diese Woche", sign: "" }),
          social: tile("social", "Social Media", "41.000", "Reichweite, 7 Tage", "−4 %", "down", "Reichweite der letzten 7 Tage: 41.000."),
          conversion: tile("conversion", "Conversion", "26 %", "Anfrage zu Mandat", "+2 Punkte", "up", "26 % der Anfragen wurden ein Mandat. 5 von 19."),
          retention: tile("retention", "Retention", "48 %", "Folgemandat in 12 Monaten", "+3 Punkte", "up", "48 % der Auftraggeber haben in 12 Monaten ein weiteres Mandat erteilt."),
          messages: tile("messages", "Nachrichten", "22", "Ungelesen", "3 Konten", "", "22 Nachrichten sind ungelesen."),
          management: tile("management", "Management", "8", "Überfällige Aufgaben", "älteste 2 Tage", "", "8 delegierte Aufgaben sind über der Frist."),
          todo: tile("todo", "To-do", "4", "Wichtig und dringend", "von 15 Punkten", "", "4 eigene Punkte sind wichtig und dringend.")
        },
        sheets: {
          finance: sheet(["Posten", "Betrag"], [["Geschäftskonto", "96.500 €"], ["Offene Fremdkosten", "18.200 €"], ["Beauftragtes Honorar", "64.000 €"]], [1]),
          tickets: sheet(["Fall", "Frist", "Kanal"], [["Location Hafen", "1 Tag über", "Auftraggeber"], ["Technikrider Linde", "heute", "Gewerk"], ["Gästeliste Körner", "2 Tage über", "Auftraggeber"], ["Anzahl Scheinwerfer", "heute", "Gewerk"]], []),
          problems: sheet(["Quelle", "Sache"], [["Location", "Hafen sagt Donnerstag ab"], ["Technik", "Licht noch unbestätigt"], ["Personal", "Eine Schicht am Freitag offen"]], []),
          social: sheet(["Kanal", "Reichweite"], [["Instagram", "28.000"], ["LinkedIn", "13.000"]], [1]),
          conversion: sheet(["Stufe", "Anzahl"], [["Anfragen", "19"], ["Angebote", "11"], ["Mandate", "5"]], [1]),
          retention: sheet(["Jahrgang", "Folgemandat"], [["2024", "44 %"], ["2025", "48 %"]], [1]),
          messages: sheet(["Konto", "Von", "Inhalt"], [["Auftraggeber", "Linde", "Rider fehlt noch"], ["Gewerk", "Lichtwerk", "Zwei Scheinwerfer offen"], ["Intern", "Nora", "Schichtplan liegt bereit"]], []),
          management: sheet(["Aufgabe", "Person", "Status"], [["Location ersetzen", "Nora", "Angefangen"], ["Licht bestätigen", "Paul", "Ausstehend"], ["Schicht Freitag", "Nora", "Ausstehend"], ["Rider an Linde", "Paul", "Beendet"]], []),
          todo: sheet(["Feld", "Punkt"], [["Wichtig und dringend", "Location heute entscheiden"], ["Wichtig und dringend", "Licht freigeben"], ["Wichtig und dringend", "Schicht Freitag besetzen"], ["Wichtig und dringend", "Linde den Rider schicken"], ["Wichtig und nicht dringend", "Herbstmappe"]], [])
        }
      }
    };

    let pack = "buch";
    let view = "home";
    const messages = [];

    const stage = document.getElementById("stage");
    const thread = document.getElementById("thread");
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const rail = document.getElementById("rail");
    const backdrop = document.getElementById("backdrop");

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function dash() { return DATA[pack]; }

    function heute(d) {
      const todo = d.tiles.todo.value === "1" ? "1 Punkt ist wichtig und dringend." : d.tiles.todo.value + " Punkte sind wichtig und dringend.";
      const tickets = d.tiles.tickets.value === "1" ? "1 Fall ist über der Frist." : d.tiles.tickets.value + " Fälle sind über der Frist.";
      const problems = d.tiles.tickets.also.value === "1" ? "1 Problem ist kritisch." : d.tiles.tickets.also.value + " Probleme sind kritisch.";
      return todo + " " + tickets + " " + problems;
    }

    function answerFor(text) {
      const d = dash();
      const q = text.toLowerCase();
      const hit = (words) => words.some((word) => q.includes(word));
      if (hit(["finanz", "geld", "liquid", "kasse", "konto"])) return d.tiles.finance.line;
      if (hit(["ticket", "fall", "support", "frist", "problem", "störung", "liefer", "server", "api", "location"])) return d.tiles.tickets.line;
      if (hit(["social", "reichweite", "instagram", "linkedin", "facebook"])) return d.tiles.social.line;
      if (hit(["conversion", "abschluss", "kauf", "test", "anfrage", "mandat"])) return d.tiles.conversion.line;
      if (hit(["retention", "bindung", "zweit", "folge"])) return d.tiles.retention.line;
      if (hit(["nachricht", "mail", "ungelesen", "post"])) return d.tiles.messages.line;
      if (hit(["management", "aufgabe", "team", "deleg"])) return d.tiles.management.line;
      if (hit(["todo", "to-do", "eisenhower", "matrix", "wichtig"])) return d.tiles.todo.line;
      if (view !== "home") return d.tiles[view].line;
      return heute(d);
    }

    // founder speak: same numbers, different coping mechanism
    const SLANG = {
      finance: { name: "cash", emoji: "💸", color: "lime" },
      tickets: { name: "fires", emoji: "🔥", color: "orange" },
      social: { name: "clout", emoji: "📈", color: "pink" },
      conversion: { name: "conversion (pls)", emoji: "🛒", color: "sky" },
      retention: { name: "they came back", emoji: "🫶", color: "lilac" },
      messages: { name: "dms", emoji: "📬", color: "yellow" },
      management: { name: "pinging the team", emoji: "🫡", color: "mint" },
      todo: { name: "side quests", emoji: "🗡️", color: "coral" }
    };
    const FLAT = { tickets: "this is fine 🙂", messages: "left on read", management: "who's on this??", todo: "touch grass later" };
    const TILTS = [-2, 1.5, -1, 2.5, -2.5, 1, -1.5, 2];
    const OPENERS = ["ngl", "lowkey", "fr", "ok so", "not gonna lie"];
    let turn = 0;

    function mood(item) {
      if (item.sign === "up") return "we're so back";
      if (item.sign === "down") return "it's so over";
      return FLAT[item.id] || "vibes tbd";
    }

    // lets the chat understand founder words before Robin's German keyword matching
    function slang(text) {
      return text.toLowerCase()
        .replace(/cash|money|runway|burn/g, "geld")
        .replace(/fire/g, "problem")
        .replace(/clout|followers|reach/g, "reichweite")
        .replace(/\bdms?\b/g, "nachricht")
        .replace(/side ?quests?/g, "todo")
        .replace(/came back|churn/g, "retention")
        .replace(/\bsales\b|\bconv\w*/g, "conversion");
    }

    function vibe(answer) {
      const opener = OPENERS[turn++ % OPENERS.length];
      const bad = /unter dem|kritisch|über der Frist|ungelesen|überfällig/i.test(answer);
      return opener + " " + answer.charAt(0).toLowerCase() + answer.slice(1) + (bad ? " 💀" : " 🚀");
    }

    function renderNav() {
      document.querySelectorAll(".nav-btn").forEach((link) => {
        const id = link.getAttribute("href").slice(1);
        if (id === view) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
      document.querySelectorAll("[data-pack]").forEach((button) => {
        button.setAttribute("aria-selected", button.dataset.pack === pack ? "true" : "false");
      });
      document.getElementById("company").textContent = dash().company;
      document.getElementById("top-company").textContent = dash().company;
      msg.placeholder = view === "home" ? "ask the group chat…" : "ask about " + SLANG[view].name + "…";
      const words = [dash().company, "build in public", "day 287", "default alive?", "ship it", "no meetings wednesday", "ramen profitable (almost)", "we're hiring (we're not)"];
      const run = words.map((word) => "<span>" + esc(word) + "</span>").join("");
      document.getElementById("ticker").innerHTML = run + run;
    }

    function nums(item) {
      return '<span class="num">' + esc(item.value) + "</span>" +
        '<span class="what">' + esc(item.metric) + (item.delta ? ' <b class="' + (item.sign || "") + '">' + esc(item.delta) + "</b>" : "") + "</span>";
    }

    // +50 % 📈, −6,7 % 📉, ±0 % 😴
    function stamp(change) {
      if (change === 0) return "±0 % 😴";
      const abs = Math.abs(change * 100);
      return (change > 0 ? "+" : "−") + String(abs >= 10 ? Math.round(abs) : abs.toFixed(1)).replace(".", ",") + (change > 0 ? " % 📈" : " % 📉");
    }

    // index is the rank by change: 0 is the main character, 1 runs wide
    function renderTile(item, index, change) {
      const s = SLANG[item.id];
      const size = index === 0 ? " sticker-l" : index === 1 ? " sticker-m" : " sticker-s";
      const body = item.also ? '<span class="two"><span>' + nums(item) + "</span><span>" + nums(item.also) + "</span></span>" : nums(item);
      return '<a class="sticker c-' + s.color + size + '" href="#' + item.id + '" style="--tilt: ' + TILTS[index % TILTS.length] + 'deg">' +
        '<span class="stamp">' + stamp(change) + "</span>" +
        '<span class="label">' + s.emoji + " " + esc(s.name) + (index === 0 ? " · main character ✨" : "") + "</span>" + body +
        '<span class="mood">' + esc(mood(item)) + "</span></a>";
    }

    function tableHtml(table) {
      const head = table.headers.map((header, index) => '<th class="' + (table.numeric.includes(index) ? "num" : "") + '">' + esc(header) + "</th>").join("");
      const body = table.rows.map((row) => "<tr>" + row.map((cell, index) => '<td class="' + (table.numeric.includes(index) ? "num" : "") + '">' + esc(cell) + "</td>").join("") + "</tr>").join("");
      return "<table><thead><tr>" + head + "</tr></thead><tbody>" + body + "</tbody></table>";
    }

    function renderSheet(item) {
      const s = SLANG[item.id];
      const big = (it) => '<div class="big">' + nums(it) + "</div>";
      let out = '<article class="sheet c-' + s.color + '"><a class="back" href="#home">← back to the vibe</a>' +
        "<h1>" + s.emoji + " " + esc(s.name) + '</h1><p class="scribble">' + esc(mood(item)) + "</p>" +
        '<div class="bigs">' + big(item) + (item.also ? big(item.also) : "") + "</div>" +
        '<p class="tldr"><b>tl;dr</b> ' + esc(item.line) + "</p>";
      if (item.also) {
        out += "<h2>open tickets</h2>" + tableHtml(dash().sheets.tickets) +
          "<h2>actually on fire</h2>" + tableHtml(dash().sheets.problems);
      } else {
        out += tableHtml(dash().sheets[item.id]);
      }
      return out + "</article>";
    }

    function renderHome(d) {
      const ups = ORDER.filter((id) => d.tiles[id].sign === "up").length;
      const downs = ORDER.filter((id) => d.tiles[id].sign === "down").length;
      const status = ups > downs ? "lowkey cooking 🍳" : "it's giving pivot 😬";
      return '<h1 class="hey">gm, ' + esc(d.company) + ' 👋</h1><p class="sub">status: ' + status + "</p>" +
        '<div class="grid">' + ORDER.slice().sort((a, b) => Math.abs(d.change[b]) - Math.abs(d.change[a]))
          .map((id, index) => renderTile(d.tiles[id], index, d.change[id])).join("") + "</div>";
    }

    function renderStage() {
      const d = dash();
      stage.innerHTML = view === "home" ? renderHome(d) : renderSheet(d.tiles[view]);
      renderNav();
    }

    function renderThread() {
      thread.innerHTML = messages.map((entry) => '<div class="msg-' + entry.role + '">' + esc(entry.text) + "</div>").join("");
      thread.scrollTop = thread.scrollHeight;
    }

    function applyHash() {
      let id = location.hash.slice(1);
      if (id === "problems") id = "tickets";
      view = id && dash().tiles[id] ? id : "home";
      renderStage();
      closeMenu();
    }

    function closeMenu() {
      rail.classList.remove("open");
      backdrop.classList.remove("show");
    }

    function submitText(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      messages.push({ role: "user", text: trimmed });
      messages.push({ role: "agent", text: vibe(answerFor(slang(trimmed))) });
      msg.value = "";
      fit();
      sendBtn.disabled = true;
      renderThread();
    }

    function fit() {
      msg.style.height = "auto";
      msg.style.height = Math.min(msg.scrollHeight, 110) + "px";
    }

    window.addEventListener("hashchange", applyHash);
    document.addEventListener("click", (event) => {
      const packBtn = event.target.closest("[data-pack]");
      if (!packBtn) return;
      pack = packBtn.dataset.pack;
      messages.length = 0;
      renderThread();
      renderStage();
    });

    document.getElementById("menu").addEventListener("click", () => {
      rail.classList.toggle("open");
      backdrop.classList.toggle("show", rail.classList.contains("open"));
    });
    backdrop.addEventListener("click", closeMenu);

    msg.addEventListener("input", () => {
      sendBtn.disabled = msg.value.trim().length === 0;
      fit();
    });
    msg.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        submitText(msg.value);
      }
    });
    document.getElementById("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      submitText(msg.value);
    });

    const Mic = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById("mic");
    if (Mic) {
      const rec = new Mic();
      rec.lang = "de-DE";
      rec.onresult = (event) => {
        msg.value = event.results[0][0].transcript;
        sendBtn.disabled = msg.value.trim().length === 0;
        fit();
        micBtn.setAttribute("aria-pressed", "false");
      };
      rec.onend = () => micBtn.setAttribute("aria-pressed", "false");
      micBtn.addEventListener("click", () => {
        if (micBtn.getAttribute("aria-pressed") === "true") {
          rec.stop();
          return;
        }
        micBtn.setAttribute("aria-pressed", "true");
        rec.start();
      });
    } else {
      micBtn.addEventListener("click", () => msg.focus());
    }

    applyHash();
  </script>
</body>
</html>
