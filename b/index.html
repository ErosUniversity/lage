<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>unc · Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    /* B · Tech: broker-app calm, black by default, numbers on the surface, positions as a list */
    :root {
      --bg: #000;
      --surface: #0f0f10;
      --chip: #1b1b1d;
      --text: #fff;
      --muted: #8d8d93;
      --line: #1f1f23;
      --good: #34c759;
      --good-bg: rgba(52, 199, 89, 0.14);
      --bad: #ff453a;
      --bad-bg: rgba(255, 69, 58, 0.14);
      --sans: "Inter", system-ui, -apple-system, sans-serif;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #fff;
      --surface: #f5f5f7;
      --chip: #efeff2;
      --text: #000;
      --muted: #6e6e73;
      --line: #e6e6ea;
      --good: #12a150;
      --good-bg: rgba(18, 161, 80, 0.1);
      --bad: #de3a2f;
      --bad-bg: rgba(222, 58, 47, 0.1);
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--bg);
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "tnum" 1, "cv11" 1;
    }
    button, textarea { font: inherit; color: inherit; }
    button, a.nav-btn, a.row, a.hero, a.back { cursor: pointer; }
    a { text-decoration: none; color: inherit; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 8px; }
    .sr {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
    }

    .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }

    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 28px 20px 20px;
      background: var(--bg);
      border-right: 1px solid var(--line);
    }
    .brand-kicker { margin: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
    .brand-name { margin: 4px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .seg button {
      border: 0;
      border-radius: 999px;
      padding: 7px 12px;
      background: var(--chip);
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .seg button:hover { color: var(--text); }
    .seg button[aria-selected="true"] { background: var(--text); color: var(--bg); }

    nav { display: flex; flex-direction: column; gap: 18px; }
    .group { display: flex; flex-direction: column; gap: 2px; }
    .group-label { margin: 0 0 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
    .nav-btn { padding: 6px 0; font-size: 15px; font-weight: 500; color: var(--muted); }
    .nav-btn:hover { color: var(--text); }
    .nav-btn[aria-current="page"] { color: var(--text); font-weight: 600; }
    .rail-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .theme-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .theme-btn:hover { background: var(--chip); }
    .note { margin: 0; font-size: 12px; color: var(--muted); }

    main { min-width: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .topbar strong { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .menu-btn { border: 0; border-radius: 999px; background: var(--chip); padding: 7px 14px; font-size: 13px; font-weight: 600; }
    .stage { padding: 40px 40px 48px; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 48px;
      align-items: start;
      max-width: 1180px;
      margin: 0 auto;
    }
    .frame { min-width: 0; }

    /* hero: the depot value */
    .hero { display: flex; flex-direction: column; padding-bottom: 8px; }
    .hero-label { font-size: 15px; font-weight: 500; color: var(--muted); }
    .hero-value {
      margin-top: 6px;
      font-size: clamp(44px, 7vw, 68px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.045em;
      white-space: nowrap;
    }
    .hero-delta { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .hero-since { font-size: 14px; color: var(--muted); }
    .delta {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .delta.up { color: var(--good); background: var(--good-bg); }
    .delta.down { color: var(--bad); background: var(--bad-bg); }
    .delta.flat { color: var(--muted); background: var(--chip); }

    .spark { margin-top: 26px; }
    .spark svg { display: block; width: 100%; height: 120px; overflow: visible; }
    .spark path { fill: none; stroke-width: 2.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .spark.up path { stroke: var(--good); }
    .spark.down path { stroke: var(--bad); }
    .spark-axis { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--muted); }

    /* positions */
    .list h2 { margin: 40px 0 6px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      margin: 0 -12px;
      padding: 12px;
      border-radius: 14px;
    }
    .row:hover { background: var(--surface); }
    .row-icon {
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--chip);
      font-size: 16px;
      font-weight: 700;
    }
    .row-main { display: flex; flex-direction: column; min-width: 0; }
    .row-name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .row-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-end { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .row-value { font-size: 16px; font-weight: 600; white-space: nowrap; }
    .row .delta { padding: 0; background: none; font-size: 13px; }
    .row .delta.flat { background: none; }
    .row-l { padding-top: 18px; padding-bottom: 18px; grid-template-columns: 56px minmax(0, 1fr) auto; }
    .row-l .row-icon { width: 56px; height: 56px; font-size: 22px; }
    .row-l .row-name { font-size: 19px; }
    .row-l .row-value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .row-s { padding-top: 8px; padding-bottom: 8px; grid-template-columns: 32px minmax(0, 1fr) auto; }
    .row-s .row-icon { width: 32px; height: 32px; font-size: 12px; }
    .row-s .row-name { font-size: 14px; }
    .row-s .row-sub { font-size: 12px; }
    .row-s .row-value { font-size: 14px; }
    .move { display: flex; align-items: center; gap: 8px; margin-top: 7px; max-width: 220px; }
    .move-track { flex: 1; height: 4px; border-radius: 4px; background: var(--chip); overflow: hidden; }
    .move-bar { display: block; height: 100%; border-radius: 4px; background: var(--text); }
    .move-pct { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .row-s .move { margin-top: 5px; }
    .row-s .move-track { height: 3px; }

    /* detail */
    .back { display: inline-block; margin-bottom: 22px; font-size: 14px; font-weight: 500; color: var(--muted); }
    .back:hover { color: var(--text); }
    .sheet-kicker { margin: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
    .sheet h1 { margin: 4px 0 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .stat { margin-top: 24px; }
    .sheet-value { margin: 0; font-size: clamp(40px, 6vw, 60px); font-weight: 600; line-height: 1; letter-spacing: -0.045em; white-space: nowrap; }
    .sheet-metric { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 0; font-size: 14px; color: var(--muted); }
    .sheet-line { margin: 24px 0 0; max-width: 52ch; font-size: 15px; color: var(--muted); }
    .sheet h2.sheet-kicker { margin: 36px 0 0; font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
    table { width: 100%; margin-top: 18px; border-collapse: collapse; }
    .sheet h2 + table { margin-top: 8px; }
    th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 0 0 10px; border-bottom: 1px solid var(--line); }
    td { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 15px; }
    td.num, th.num { text-align: right; padding-right: 0; font-weight: 600; }
    tr:last-child td { border-bottom: 0; }

    /* chat */
    .chat-panel {
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      height: min(680px, calc(100vh - 80px));
      overflow: hidden;
      background: var(--surface);
      border-radius: 22px;
    }
    .chat-head { padding: 18px 18px 10px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .thread { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: auto; padding: 8px 14px 14px; }
    .thread:empty::before { content: "Frag nach Kontostand, Fristen, Reichweite oder Aufgaben."; padding: 4px; font-size: 14px; color: var(--muted); }
    .msg-user, .msg-agent { max-width: 82%; padding: 9px 13px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
    .msg-user { align-self: flex-end; background: var(--text); color: var(--bg); border-bottom-right-radius: 6px; }
    .msg-agent { align-self: flex-start; background: var(--chip); border-bottom-left-radius: 6px; }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      margin: 0 10px 10px;
      padding: 4px 4px 4px 16px;
      background: var(--chip);
      border-radius: 24px;
    }
    textarea {
      flex: 1;
      border: 0;
      resize: none;
      background: transparent;
      padding: 9px 0;
      line-height: 22px;
      max-height: 110px;
      min-height: 40px;
      font-size: 14px;
    }
    textarea::placeholder { color: var(--muted); }
    .icon-btn {
      width: 36px; height: 36px; flex: none;
      display: grid; place-items: center;
      border: 0; border-radius: 50%;
      background: transparent;
    }
    .icon-btn:hover { background: var(--surface); }
    .icon-btn[aria-pressed="true"] { background: var(--bad); color: #fff; }
    #send { background: var(--text); color: var(--bg); }
    #send:disabled { opacity: 0.25; }
    .icon-btn svg { width: 16px; height: 16px; display: block; }

    .backdrop { display: none; }

    @media (max-width: 1060px) {
      .workspace { grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; }
      .stage { padding: 28px 24px 40px; }
    }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .topbar { display: flex; }
      .rail {
        position: fixed;
        z-index: 4;
        width: min(300px, 88vw);
        transform: translateX(-105%);
        transition: transform 160ms ease;
      }
      .rail.open { transform: none; }
      .backdrop.show { display: block; position: fixed; inset: 0; z-index: 3; background: rgba(0, 0, 0, 0.55); }
      .stage { padding: 24px 16px 32px; }
      .workspace { grid-template-columns: 1fr; gap: 32px; }
      .chat-panel { position: static; height: 520px; }
      .stats { gap: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rail { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="../brand.css">
  <script src="../brand.js" defer></script>
  <script src="../bridge.js" defer></script>
</head>

              </svg>

              </svg>

          </aside>
        </div>
      </div>
    </main>
  </div>
  <script>
    const ORDER = ["finance", "tickets", "social", "conversion", "retention", "messages", "management", "todo"];
    const GROUPS = { finance: "Lage", tickets: "Lage", social: "Wachstum", conversion: "Wachstum", retention: "Wachstum", messages: "Handeln", management: "Handeln", todo: "Handeln" };

    function tile(id, category, value, metric, delta, sign, line, also) {
      return { id, category, value, metric, delta, sign, line, also: also || null };
    }
    function sheet(headers, rows, numeric) {
      return { headers, rows, numeric };
    }

    // change: relative Veränderung je Bereich, bestimmt die Kachelgröße. Aus den Kacheln abgeleitet;
    // für Nachrichten, Management und To-do sind die Vorwerte ausgedacht.

          management: sheet(["Aufgabe", "Person", "Status"], [["Lagermeldung", "Lena", "Ausstehend"], ["Schaufenster", "Tim", "Angefangen"], ["Inventur Krimi", "Lena", "Ausstehend"], ["Kasse zählen", "Tim", "Beendet"]], []),

      },

        sheets: {
          finance: sheet(["Posten", "Betrag"], [["Geschäftskonto", "310.000 €"], ["Löhne, diese Woche", "42.000 €"], ["Hosting, diese Woche", "1.800 €"]], [1]),
          tickets: sheet(["Fall", "Frist", "Kanal"], [["Login, API-Fehler", "3 Stunden über", "Support"], ["Export bricht ab", "1 Tag über", "Support"], ["Rechnung Holm", "heute", "Firma"], ["Testkonto ohne Mail", "2 Tage über", "Support"]], []),
          problems: sheet(["Quelle", "Sache"], [["Produkt", "API antwortet seit 40 Minuten mit Fehlern"]], []),
          social: sheet(["Kanal", "Reichweite"], [["LinkedIn", "62.000"]], [1]),
          conversion: sheet(["Stufe", "Anzahl"], [["Testkonten", "180"], ["Aktiviert", "96"], ["Zahlend", "31"]], [1]),
          retention: sheet(["Kohorte", "Noch zahlend"], [["Juli", "96 %"], ["August", "94 %"], ["September", "94 %"]], [1]),
          messages: sheet(["Konto", "Von", "Inhalt"], [["Support", "Kunde Holm", "Export bricht ab"], ["Firma", "Steuerbüro", "Lohnunterlagen"], ["Intern", "Mira", "Fix liegt auf Staging"]], []),
          management: sheet(["Aufgabe", "Person", "Status"], [["API-Fix", "Mira", "Angefangen"], ["Kundeninfo Holm", "Jonas", "Ausstehend"], ["Lohn freigeben", "Jonas", "Ausstehend"], ["Staging prüfen", "Mira", "Beendet"]], []),
          todo: sheet(["Feld", "Punkt"], [["Wichtig und dringend", "API-Lage entscheiden"], ["Wichtig und dringend", "Lohn freigeben"], ["Wichtig und nicht dringend", "Preisliste Q4"], ["Nicht wichtig und dringend", "Statusseite aktualisieren"]], [])
        }
      },
      event: {
        company: "Atelier Süd",
        change: { finance: 0.095, tickets: 0.333, social: -0.04, conversion: 0.083, retention: 0.067, messages: 0.467, management: 0, todo: 1 },
        tiles: {
          finance: tile("finance", "Finance", "96.500 €", "Liquide Mittel", "+8.400 €", "up", "96.500 € liquide Mittel, 8.400 € über dem Vormonat."),
          tickets: tile("tickets", "Tickets & Probleme", "4", "Überfällige Fälle", "1 seit gestern", "", "4 Rückfragen sind über der Frist. 3 Probleme sind kritisch. Location und Licht betreffen diese Woche.", { value: "3", metric: "Kritisch und offen", delta: "2 betreffen diese Woche", sign: "" }),
          social: tile("social", "Social Media", "41.000", "Reichweite, 7 Tage", "−4 %", "down", "Reichweite der letzten 7 Tage: 41.000."),
          conversion: tile("conversion", "Conversion", "26 %", "Anfrage zu Mandat", "+2 Punkte", "up", "26 % der Anfragen wurden ein Mandat. 5 von 19."),
          retention: tile("retention", "Retention", "48 %", "Folgemandat in 12 Monaten", "+3 Punkte", "up", "48 % der Auftraggeber haben in 12 Monaten ein weiteres Mandat erteilt."),
          messages: tile("messages", "Nachrichten", "22", "Ungelesen", "3 Konten", "", "22 Nachrichten sind ungelesen."),
          management: tile("management", "Management", "8", "Überfällige Aufgaben", "älteste 2 Tage", "", "8 delegierte Aufgaben sind über der Frist."),
          todo: tile("todo", "To-do", "4", "Wichtig und dringend", "von 15 Punkten", "", "4 eigene Punkte sind wichtig und dringend.")
        },
        sheets: {
          finance: sheet(["Posten", "Betrag"], [["Geschäftskonto", "96.500 €"], ["Offene Fremdkosten", "18.200 €"], ["Beauftragtes Honorar", "64.000 €"]], [1]),
          tickets: sheet(["Fall", "Frist", "Kanal"], [["Location Hafen", "1 Tag über", "Auftraggeber"], ["Technikrider Linde", "heute", "Gewerk"], ["Gästeliste Körner", "2 Tage über", "Auftraggeber"], ["Anzahl Scheinwerfer", "heute", "Gewerk"]], []),
          problems: sheet(["Quelle", "Sache"], [["Location", "Hafen sagt Donnerstag ab"], ["Technik", "Licht noch unbestätigt"], ["Personal", "Eine Schicht am Freitag offen"]], []),
          social: sheet(["Kanal", "Reichweite"], [["Instagram", "28.000"], ["LinkedIn", "13.000"]], [1]),
          conversion: sheet(["Stufe", "Anzahl"], [["Anfragen", "19"], ["Angebote", "11"], ["Mandate", "5"]], [1]),
          retention: sheet(["Jahrgang", "Folgemandat"], [["2024", "44 %"], ["2025", "48 %"]], [1]),
          messages: sheet(["Konto", "Von", "Inhalt"], [["Auftraggeber", "Linde", "Rider fehlt noch"], ["Gewerk", "Lichtwerk", "Zwei Scheinwerfer offen"], ["Intern", "Nora", "Schichtplan liegt bereit"]], []),
          management: sheet(["Aufgabe", "Person", "Status"], [["Location ersetzen", "Nora", "Angefangen"], ["Licht bestätigen", "Paul", "Ausstehend"], ["Schicht Freitag", "Nora", "Ausstehend"], ["Rider an Linde", "Paul", "Beendet"]], []),
          todo: sheet(["Feld", "Punkt"], [["Wichtig und dringend", "Location heute entscheiden"], ["Wichtig und dringend", "Licht freigeben"], ["Wichtig und dringend", "Schicht Freitag besetzen"], ["Wichtig und dringend", "Linde den Rider schicken"], ["Wichtig und nicht dringend", "Herbstmappe"]], [])
        }
      }
    };

    let pack = "buch";
    let view = "home";
    const messages = [];

    const stage = document.getElementById("stage");
    const thread = document.getElementById("thread");
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const rail = document.getElementById("rail");
    const backdrop = document.getElementById("backdrop");

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function dash() { return DATA[pack]; }

    function heute(d) {
      const todo = d.tiles.todo.value === "1" ? "1 Punkt ist wichtig und dringend." : d.tiles.todo.value + " Punkte sind wichtig und dringend.";
      const tickets = d.tiles.tickets.value === "1" ? "1 Fall ist über der Frist." : d.tiles.tickets.value + " Fälle sind über der Frist.";
      const problems = d.tiles.tickets.also.value === "1" ? "1 Problem ist kritisch." : d.tiles.tickets.also.value + " Probleme sind kritisch.";
      return todo + " " + tickets + " " + problems;
    }

    function answerFor(text) {
      const d = dash();
      const q = text.toLowerCase();
      const hit = (words) => words.some((word) => q.includes(word));
      if (hit(["finanz", "geld", "liquid", "kasse", "konto"])) return d.tiles.finance.line;
      if (hit(["ticket", "fall", "support", "frist", "problem", "störung", "liefer", "server", "api", "location"])) return d.tiles.tickets.line;
      if (hit(["social", "reichweite", "instagram", "linkedin", "facebook"])) return d.tiles.social.line;
      if (hit(["conversion", "abschluss", "kauf", "test", "anfrage", "mandat"])) return d.tiles.conversion.line;
      if (hit(["retention", "bindung", "zweit", "folge"])) return d.tiles.retention.line;
      if (hit(["nachricht", "mail", "ungelesen", "post"])) return d.tiles.messages.line;
      if (hit(["management", "aufgabe", "team", "deleg"])) return d.tiles.management.line;
      if (hit(["todo", "to-do", "eisenhower", "matrix", "wichtig"])) return d.tiles.todo.line;
      if (view !== "home") return d.tiles[view].line;
      return heute(d);
    }

    function renderNav() {
      document.querySelectorAll(".nav-btn").forEach((link) => {
        const id = link.getAttribute("href").slice(1);
        if (id === view) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
      document.querySelectorAll("[data-pack]").forEach((button) => {
        button.setAttribute("aria-selected", button.dataset.pack === pack ? "true" : "false");
      });
      document.getElementById("company").textContent = dash().company;
      document.getElementById("top-company").textContent = dash().company;
      const place = view === "home" ? "zum Unternehmen" : "zu " + dash().tiles[view].category;
      msg.placeholder = "Frage " + place;
    }

    // "42.800 €" → 42800, "−18.000 €" → -18000, "4,2 %" → 4.2
    function num(text) {
      const n = parseFloat(String(text).replace(/[^\d,−+-]/g, "").replace("−", "-").replace(",", "."));
      return isNaN(n) ? null : n;
    }

    function deltaChip(item) {
      if (!item.delta) return "";
      return '<span class="delta ' + (item.sign || "flat") + '">' + esc(item.delta) + "</span>";
    }

    // only two real points exist (last month, today), so the line joins exactly those
    function spark(item) {
      const now = num(item.value);
      const change = num(item.delta);
      if (now === null || change === null) return "";
      const up = change >= 0;
      const from = up ? 68 : 12;
      const to = up ? 12 : 68;
      return '<div class="spark ' + (up ? "up" : "down") + '">' +
        '<svg viewBox="0 0 300 80" preserveAspectRatio="none" aria-hidden="true">' +
        '<path d="M0 ' + from + " C 140 " + from + ", 160 " + to + ", 300 " + to + '"/></svg>' +
        '<div class="spark-axis"><span>Vormonat · ' + esc((now - change).toLocaleString("de-DE")) + " €</span><span>Heute</span></div></div>";
    }

    function renderHero(item) {
      return '<a class="hero" href="#finance">' +
        '<span class="hero-label">' + esc(item.metric) + "</span>" +
        '<span class="hero-value">' + esc(item.value) + "</span>" +
        '<span class="hero-delta">' + deltaChip(item) + '<span class="hero-since">seit Vormonat</span></span>' +
        spark(item) + "</a>";
    }

    // +50 %, −6,7 %, ±0 %
    function pct(change) {
      if (change === 0) return "±0 %";
      const abs = Math.abs(change * 100);
      return (change > 0 ? "+" : "−") + String(abs >= 10 ? Math.round(abs) : abs.toFixed(1)).replace(".", ",") + " %";
    }

    // bar length is the change relative to the biggest mover in the list
    function moveBar(change, max) {
      const width = max ? Math.max(3, Math.round((Math.abs(change) / max) * 100)) : 3;
      return '<span class="move"><span class="move-track"><span class="move-bar" style="width: ' + width + '%"></span></span>' +
        '<span class="move-pct">' + pct(change) + "</span></span>";
    }

    function renderRow(item, size, change, max) {
      const sub = item.also ? item.metric + " · " + item.also.value + " " + item.also.metric : item.metric;
      return '<a class="row row-' + size + '" href="#' + item.id + '">' +
        '<span class="row-icon" aria-hidden="true">' + esc(item.category.charAt(0)) + "</span>" +
        '<span class="row-main"><span class="row-name">' + esc(item.category) + '</span><span class="row-sub">' + esc(sub) + "</span>" +
        moveBar(change, max) + "</span>" +
        '<span class="row-end"><span class="row-value">' + esc(item.value) + "</span>" + deltaChip(item) + "</span></a>";
    }

    function tableHtml(table) {
      const head = table.headers.map((header, index) => '<th class="' + (table.numeric.includes(index) ? "num" : "") + '">' + esc(header) + "</th>").join("");
      const body = table.rows.map((row) => "<tr>" + row.map((cell, index) => '<td class="' + (table.numeric.includes(index) ? "num" : "") + '">' + esc(cell) + "</td>").join("") + "</tr>").join("");
      return "<table><thead><tr>" + head + "</tr></thead><tbody>" + body + "</tbody></table>";
    }

    function renderSheet(item) {
      const stat = (it) => '<div class="stat"><p class="sheet-value">' + esc(it.value) + '</p><p class="sheet-metric">' + esc(it.metric) + " " + deltaChip(it) + "</p></div>";
      let out = '<article class="sheet"><a class="back" href="#home">‹ Übersicht</a>' +
        '<p class="sheet-kicker">' + esc(GROUPS[item.id]) + "</p><h1>" + esc(item.category) + "</h1>" +
        (item.also ? '<div class="stats">' + stat(item) + stat(item.also) + "</div>" : stat(item)) +
        (item.id === "finance" ? spark(item) : "") +
        '<p class="sheet-line">' + esc(item.line) + "</p>";
      if (item.also) {
        out += '<h2 class="sheet-kicker">Tickets</h2>' + tableHtml(dash().sheets.tickets) +
          '<h2 class="sheet-kicker">Probleme</h2>' + tableHtml(dash().sheets.problems);
      } else {
        out += tableHtml(dash().sheets[item.id]);
      }
      return out + "</article>";
    }

    // finance stays the hero; the other positions are sorted and sized by how much they moved
    function renderHome(d) {
      const ids = ORDER.filter((id) => id !== "finance").sort((a, b) => Math.abs(d.change[b]) - Math.abs(d.change[a]));
      const max = Math.abs(d.change[ids[0]]);
      const size = (rank) => (rank < 2 ? "l" : rank < 4 ? "m" : "s");
      return '<h1 class="sr">Übersicht</h1>' + renderHero(d.tiles.finance) +
        '<section class="list"><h2>Größte Bewegung</h2>' +
        ids.map((id, rank) => renderRow(d.tiles[id], size(rank), d.change[id], max)).join("") + "</section>";
    }

    function renderStage() {
      const d = dash();
      stage.innerHTML = view === "home" ? renderHome(d) : renderSheet(d.tiles[view]);
      renderNav();
    }

    function renderThread() {
      thread.innerHTML = messages.map((entry) => '<div class="msg-' + entry.role + '">' + esc(entry.text) + "</div>").join("");
      thread.scrollTop = thread.scrollHeight;
    }

    function applyHash() {
      let id = location.hash.slice(1);
      if (id === "problems") id = "tickets";
      view = id && dash().tiles[id] ? id : "home";
      renderStage();
      closeMenu();
    }

    function closeMenu() {
      rail.classList.remove("open");
      backdrop.classList.remove("show");
    }

    function submitText(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      messages.push({ role: "user", text: trimmed });
      messages.push({ role: "agent", text: answerFor(trimmed) });
      msg.value = "";
      fit();
      sendBtn.disabled = true;
      renderThread();
    }

    function fit() {
      msg.style.height = "auto";
      msg.style.height = Math.min(msg.scrollHeight, 110) + "px";
    }

    window.addEventListener("hashchange", applyHash);
    document.addEventListener("click", (event) => {
      const packBtn = event.target.closest("[data-pack]");
      if (!packBtn) return;
      pack = packBtn.dataset.pack;
      messages.length = 0;
      renderThread();
      renderStage();
    });

    document.getElementById("menu").addEventListener("click", () => {
      rail.classList.toggle("open");
      backdrop.classList.toggle("show", rail.classList.contains("open"));
    });
    backdrop.addEventListener("click", closeMenu);

    msg.addEventListener("input", () => {
      sendBtn.disabled = msg.value.trim().length === 0;
      fit();
    });
    msg.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        submitText(msg.value);
      }
    });
    document.getElementById("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      submitText(msg.value);
    });

    const Mic = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById("mic");
    if (Mic) {
      const rec = new Mic();
      rec.lang = "de-DE";
      rec.onresult = (event) => {
        msg.value = event.results[0][0].transcript;
        sendBtn.disabled = msg.value.trim().length === 0;
        fit();
        micBtn.setAttribute("aria-pressed", "false");
      };
      rec.onend = () => micBtn.setAttribute("aria-pressed", "false");
      micBtn.addEventListener("click", () => {
        if (micBtn.getAttribute("aria-pressed") === "true") {
          rec.stop();
          return;
        }
        micBtn.setAttribute("aria-pressed", "true");
        rec.start();
      });
    } else {
      micBtn.addEventListener("click", () => msg.focus());
    }

    const themeBtn = document.getElementById("theme");
    function setTheme(light) {
      document.documentElement.dataset.theme = light ? "light" : "dark";
      themeBtn.setAttribute("aria-pressed", String(light));
      themeBtn.textContent = light ? "Dunkel" : "Hell";
      try { localStorage.setItem("lage-b-theme", light ? "light" : "dark"); } catch (e) {}
    }
    let startLight = false;
    try { startLight = localStorage.getItem("lage-b-theme") === "light"; } catch (e) {}
    setTheme(startLight);
    themeBtn.addEventListener("click", () => setTheme(document.documentElement.dataset.theme !== "light"));

    applyHash();
  </script>
</body>
</html>
