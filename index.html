<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Inter:wght@400;500&display=swap">
  <style>
    /* A · Zeitung: newsprint, serif numbers, hairline columns, masthead instead of sidebar */
    :root {
      --bg: #f2eee5;
      --ink: #141310;
      --muted: #5d584f;
      --faint: #8a8378;
      --hair: #cfc8bb;
      --good: #1d6b43;
      --bad: #a3271b;
      --hover: #ebe6db;
      --scrim: rgba(20, 19, 16, 0.3);
      --serif: "Newsreader", Georgia, serif;
      --sans: "Inter", system-ui, -apple-system, sans-serif;
      color-scheme: light;
    }
    /* Nachtausgabe: dark paper, follows the system setting */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191712;
        --ink: #ebe5d6;
        --muted: #aaa293;
        --faint: #7c7568;
        --hair: #3a362e;
        --good: #86c79f;
        --bad: #ee8f80;
        --hover: #211f19;
        --scrim: rgba(0, 0, 0, 0.55);
        color-scheme: dark;
      }
      .dateline::after { content: " · Nachtausgabe"; }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--bg);
      font-size: 15px;
      line-height: 1.45;
    }
    button, textarea { font: inherit; color: inherit; }
    button, a.nav-btn, a.tile { cursor: pointer; }
    a.nav-btn, a.tile { text-decoration: none; color: inherit; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .sr {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
    }

    .app { max-width: 1240px; margin: 0 auto; padding: 0 32px 56px; }

    /* masthead */
    .rail {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 0 24px;
      padding-top: 22px;
      border-bottom: 4px double var(--ink);
    }
    .brand {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-areas: "k n s";
      align-items: end;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--ink);
    }
    .brand-meta { grid-area: k; margin-bottom: 6px; }
    .brand-kicker {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .dateline { margin: 4px 0 0; font: italic 400 15px/1.2 var(--serif); color: var(--muted); }
    .brand-name {
      grid-area: n;
      margin: 0;
      font: 500 64px/0.95 var(--serif);
      letter-spacing: -0.03em;
      text-align: center;
    }
    .seg {
      grid-area: s;
      justify-self: end;
      display: flex;
      gap: 14px;
      margin-bottom: 6px;
    }
    .seg button {
      border: 0;
      background: none;
      padding: 0 0 2px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
      border-bottom: 1px solid transparent;
    }
    .seg button:hover { color: var(--ink); }
    .seg button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

    nav { display: flex; flex-wrap: wrap; gap: 6px 28px; padding: 10px 0; }
    .group { display: flex; align-items: baseline; gap: 14px; }
    .group-label {
      margin: 0;
      font: italic 400 14px var(--serif);
      color: var(--faint);
    }
    .nav-btn {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 2px 0;
      border-bottom: 2px solid transparent;
    }
    .nav-btn:hover { border-bottom-color: var(--hair); }
    .nav-btn[aria-current="page"] { border-bottom-color: var(--ink); }
    .note {
      margin: 0;
      font: italic 400 14px var(--serif);
      color: var(--faint);
    }

    .topbar { display: none; }
    .menu-btn {
      border: 1px solid var(--ink);
      background: none;
      padding: 5px 12px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .stage { padding-top: 26px; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      align-items: stretch;
    }
    .frame { min-width: 0; padding-right: 28px; border-right: 1px solid var(--ink); }

    /* front page: finance is the lead story */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--hair);
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
    }
    .tile {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-height: 176px;
      padding: 14px 16px 16px;
      background: var(--bg);
      transition: background 120ms;
    }
    .tile:hover { background: var(--hover); }
    .tile[href="#finance"] { grid-column: span 2; grid-row: span 2; }
    .tile[href="#tickets"] { grid-column: span 2; }
    .tile-cat {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .tile-group { display: block; margin-bottom: 3px; color: var(--faint); }
    .tile-value {
      display: block;
      margin-top: 22px;
      font: 400 46px/1 var(--serif);
      letter-spacing: -0.02em;
      font-variant-numeric: lining-nums tabular-nums;
    }
    .tile[href="#finance"] .tile-value { font-size: 104px; letter-spacing: -0.04em; }
    .tile-meta {
      display: flex;
      flex-direction: column;
      margin-top: 8px;
      font: italic 400 15px/1.3 var(--serif);
      color: var(--muted);
    }
    .tile[href="#finance"] .tile-meta { flex-direction: row; justify-content: space-between; gap: 12px; font-size: 19px; }
    .tile-meta > span:last-child { white-space: nowrap; }
    .tile-dek {
      display: block;
      max-width: 30ch;
      margin-top: auto;
      padding-top: 22px;
      font: 400 23px/1.3 var(--serif);
      letter-spacing: -0.005em;
    }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
    .pair > span + span { border-left: 1px solid var(--hair); padding-left: 20px; }
    .pair .tile-value { margin-top: 0; }
        .up { color: var(--good); }
    .down { color: var(--bad); }

    /* detail page */
    .sheet { border-top: 1px solid var(--ink); padding-top: 14px; }
    .sheet-kicker {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sheet h1 { margin: 8px 0 0; font: 500 52px/1 var(--serif); letter-spacing: -0.025em; }
    .sheet-dek { max-width: 36ch; margin: 14px 0 0; font: italic 400 22px/1.35 var(--serif); color: var(--muted); }
    .sheet-value {
      margin: 28px 0 0;
      font: 400 96px/0.95 var(--serif);
      letter-spacing: -0.04em;
      font-variant-numeric: lining-nums tabular-nums;
    }
    .sheet-metric { margin: 10px 0 0; font: italic 400 19px var(--serif); color: var(--muted); }
    .sheet h2.sheet-kicker { margin: 40px 0 0; }
    .sheet .pair .sheet-value { font-size: 72px; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; border-top: 1px solid var(--ink); }
    .sheet h2 + table { margin-top: 10px; }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--faint);
      padding: 10px 0 8px;
      border-bottom: 1px solid var(--hair);
    }
    td {
      padding: 12px 16px 12px 0;
      border-bottom: 1px solid var(--hair);
      vertical-align: top;
      font: 400 18px/1.35 var(--serif);
    }
    td.num, th.num { text-align: right; padding-right: 0; font-variant-numeric: lining-nums tabular-nums; }
    tr:last-child td { border-bottom: 0; }

    /* chat as the letters column */
    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 620px;
      padding-left: 24px;
    }
    .chat-head {
      padding-bottom: 10px;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--hair);
      padding-top: 14px;
      font: italic 500 24px/1 var(--serif);
    }
    .chat-head::after {
      content: "Fragen an die Redaktion";
      display: block;
      margin-top: 6px;
      font: normal 400 11px var(--sans);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .thread {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: auto;
      padding: 18px 0;
    }
    .thread:empty::before {
      content: "Fragen Sie nach Geld, Fristen, Reichweite oder Aufgaben.";
      font: italic 400 16px/1.4 var(--serif);
      color: var(--faint);
    }
    .msg-user {
      align-self: flex-end;
      max-width: 85%;
      padding: 0 10px 0 0;
      border-right: 2px solid var(--ink);
      font: italic 400 16px/1.4 var(--serif);
      text-align: right;
      color: var(--muted);
    }
    .msg-agent { max-width: 100%; font: 400 18px/1.45 var(--serif); }
    .msg-agent::first-letter { font-size: 1.9em; float: left; line-height: 0.9; padding: 4px 6px 0 0; }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      margin-top: auto;
      border-top: 1px solid var(--ink);
      padding-top: 8px;
    }
    textarea {
      flex: 1;
      border: 0;
      resize: none;
      background: transparent;
      padding: 9px 0;
      line-height: 22px;
      max-height: 110px;
      min-height: 40px;
      font: italic 400 17px/22px var(--serif);
    }
    textarea::placeholder { color: var(--faint); }
    .icon-btn {
      width: 36px; height: 36px; flex: none;
      display: grid; place-items: center;
      border: 0; border-radius: 50%;
      background: transparent;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    #send { background: var(--ink); color: var(--bg); }
    #send:disabled { opacity: 0.25; }
    .icon-btn svg { width: 16px; height: 16px; display: block; }

    .backdrop { display: none; }

    @media (max-width: 860px) {
      .app { padding: 0 16px 40px; }
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 0 12px;
        border-bottom: 4px double var(--ink);
      }
      .topbar strong { font: 500 28px/1 var(--serif); letter-spacing: -0.02em; }
      .rail {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: min(300px, 88vw);
        padding: 22px 18px;
        overflow: auto;
        background: var(--bg);
        border: 0;
        border-right: 1px solid var(--ink);
        transform: translateX(-105%);
        transition: transform 160ms ease;
      }
      .rail.open { transform: none; }
      .brand { display: block; border: 0; padding: 0; }
      .brand-name { font-size: 40px; text-align: left; margin-top: 6px; }
      .seg { justify-self: stretch; justify-content: flex-start; margin-top: 14px; }
      nav { flex-direction: column; gap: 14px; padding: 0; }
      .group { flex-direction: column; gap: 6px; }
      .backdrop.show { display: block; position: fixed; inset: 0; z-index: 3; background: var(--scrim); }
      .stage { padding-top: 18px; }
      .workspace { grid-template-columns: 1fr; }
      .frame { padding-right: 0; border-right: 0; }
      .chat-panel { padding-left: 0; margin-top: 28px; min-height: 480px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 0; }
      .sheet { border-top: 0; padding-top: 0; }
      .tile-dek { font-size: 19px; padding-top: 14px; }
      .sheet-dek { font-size: 19px; }
      .tile[href="#finance"] { grid-row: auto; }
      .tile { min-height: 140px; }
      .tile-value { font-size: 34px; margin-top: 16px; }
      .tile[href="#finance"] .tile-value { font-size: 64px; }
      .sheet h1 { font-size: 38px; }
      .sheet-value { font-size: 64px; }
      .sheet .pair .sheet-value { font-size: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rail, .tile { transition: none; }
    }

    /* numbers shrink with their tile instead of breaking */
    .tile { container-type: inline-size; }
    .tile-value { white-space: nowrap; font-size: min(46px, 17cqi); }
    .tile[href="#finance"] .tile-value { font-size: min(104px, 21cqi); }
    .pair .tile-value { font-size: min(46px, 9cqi); }
    .sheet { container-type: inline-size; }
    .sheet-value { white-space: nowrap; font-size: min(96px, 17cqi); }
    .sheet .pair .sheet-value { font-size: min(72px, 8.5cqi); }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" id="rail">
      <div class="brand">
        <div class="brand-meta">
          <p class="brand-kicker">Lage</p>
          <p class="dateline" id="dateline"></p>
        </div>
        <p class="brand-name" id="company">Heft &amp; Bogen</p>
        <div class="seg" role="tablist" aria-label="Betrieb">
          <button type="button" role="tab" data-pack="buch" aria-selected="true">Buchladen</button>
          <button type="button" role="tab" data-pack="software" aria-selected="false">Software</button>
          <button type="button" role="tab" data-pack="event" aria-selected="false">Event</button>
        </div>
      </div>
      <nav aria-label="Bereiche">
        <div class="group">
          <a class="nav-btn" href="#home">Übersicht</a>
        </div>
        <div class="group">
          <p class="group-label">Lage</p>
          <a class="nav-btn" href="#finance">Finance</a>
          <a class="nav-btn" href="#tickets">Tickets &amp; Probleme</a>
        </div>
        <div class="group">
          <p class="group-label">Wachstum</p>
          <a class="nav-btn" href="#social">Social Media</a>
          <a class="nav-btn" href="#conversion">Conversion</a>
          <a class="nav-btn" href="#retention">Retention</a>
        </div>
        <div class="group">
          <p class="group-label">Handeln</p>
          <a class="nav-btn" href="#messages">Nachrichten</a>
          <a class="nav-btn" href="#management">Management</a>
          <a class="nav-btn" href="#todo">To-do</a>
        </div>
      </nav>
      <p class="note">Beispieldaten</p>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <main>
      <div class="topbar">
        <button class="menu-btn" type="button" id="menu">Menü</button>
        <strong id="top-company">Heft &amp; Bogen</strong>
      </div>
      <div class="stage">
        <div class="workspace">
          <div class="frame" id="stage"></div>
          <aside class="chat-panel" aria-label="Chat">
            <div class="chat-head">Chat</div>
            <div class="thread" id="thread" aria-live="polite"></div>
            <form class="composer" id="composer">
            <label class="sr" for="msg">Nachricht</label>
            <textarea id="msg" rows="1" placeholder="Nachricht schreiben"></textarea>
            <button class="icon-btn" type="button" id="mic" aria-label="Mikrofon" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <rect x="6" y="1.5" width="4" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="M4 8.2a4 4 0 0 0 8 0M8 12.2v2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="icon-btn" type="submit" id="send" aria-label="Senden" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 13V3.5M8 3.5 4.2 7.2M8 3.5l3.8 3.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
          </aside>
        </div>
      </div>
    </main>
  </div>
  <script>
    const ORDER = ["finance", "tickets", "social", "conversion", "retention", "messages", "management", "todo"];
    const GROUPS = { finance: "Lage", tickets: "Lage", social: "Wachstum", conversion: "Wachstum", retention: "Wachstum", messages: "Handeln", management: "Handeln", todo: "Handeln" };

    function tile(id, category, value, metric, delta, sign, line, also) {
      return { id, category, value, metric, delta, sign, line, also: also || null };
    }
    function sheet(headers, rows, numeric) {
      return { headers, rows, numeric };
    }

    const DATA = {
      buch: {
        company: "Heft & Bogen",
        tiles: {
          finance: tile("finance", "Finance", "42.800 €", "Liquide Mittel", "+2.100 €", "up", "42.800 € liquide Mittel, 2.100 € über dem Vormonat."),
          tickets: tile("tickets", "Tickets & Probleme", "6", "Überfällige Fälle", "2 seit gestern", "", "6 Fälle sind über der Frist. 2 Probleme sind kritisch. Eines ist der fehlende Nachtzug.", { value: "2", metric: "Kritisch und offen", delta: "1 in der Lieferkette", sign: "" }),
          social: tile("social", "Social Media", "18.400", "Reichweite, 7 Tage", "+12 %", "up", "Reichweite der letzten 7 Tage: 18.400, davon 12.100 auf Instagram."),
          conversion: tile("conversion", "Conversion", "4,2 %", "Käufe je Besuch", "−0,3 Punkte", "down", "4,2 % der Besuche wurden ein Kauf. 52 Käufe aus 1.240 Besuchen."),
          retention: tile("retention", "Retention", "31 %", "Zweitkauf in 90 Tagen", "+1 Punkt", "up", "31 % der Käufer haben in 90 Tagen ein zweites Mal gekauft."),
          messages: tile("messages", "Nachrichten", "14", "Ungelesen", "3 Konten", "", "14 Nachrichten sind ungelesen."),
          management: tile("management", "Management", "5", "Überfällige Aufgaben", "älteste 4 Tage", "", "5 delegierte Aufgaben sind über der Frist."),
          todo: tile("todo", "To-do", "3", "Wichtig und dringend", "von 11 Punkten", "", "3 eigene Punkte sind wichtig und dringend.")
        },
        sheets: {
          finance: sheet(["Konto", "Stand"], [["Geschäftskonto", "38.200 €"], ["Kasse", "4.600 €"], ["Lieferanten, fällig in 14 Tagen", "6.400 €"]], [1]),
          tickets: sheet(["Fall", "Frist", "Kanal"], [["Abholung Nachtzug", "2 Tage über", "Laden"], ["Karton Suhrkamp", "1 Tag über", "Verlag"], ["Rechnung Müller", "heute", "Laden"], ["Schulbestellung", "4 Tage über", "Schule"]], []),
          problems: sheet(["Quelle", "Sache"], [["Lieferkette", "Nachtzug, Verlag liefert nicht"], ["Server", "Shop langsam seit 6 Minuten"]], []),
          social: sheet(["Kanal", "Reichweite"], [["Instagram", "12.100"], ["Facebook", "6.300"]], [1]),
          conversion: sheet(["Stufe", "Anzahl"], [["Besuche", "1.240"], ["Reservierungen", "86"], ["Käufe", "52"]], [1]),
          retention: sheet(["Kohorte", "Zweitkauf"], [["Juni", "28 %"], ["Juli", "33 %"], ["August", "31 %"]], [1]),
          messages: sheet(["Konto", "Von", "Inhalt"], [["Laden", "Frau Kehl", "Ist der Nachtzug da?"], ["Verlag", "Suhrkamp", "Neuer Termin 28.10."], ["Intern", "Lena", "Bestand ist geprüft"]], []),
          management: sheet(["Aufgabe", "Person", "Status"], [["Lagermeldung", "Lena", "Ausstehend"], ["Schaufenster", "Tim", "Angefangen"], ["Inventur Krimi", "Lena", "Ausstehend"], ["Kasse zählen", "Tim", "Beendet"]], []),
          todo: sheet(["Feld", "Punkt"], [["Wichtig und dringend", "Verlag anrufen"], ["Wichtig und dringend", "Schulbestellung klären"], ["Wichtig und dringend", "Kassensturz"], ["Wichtig und nicht dringend", "Herbstprogramm"], ["Nicht wichtig und dringend", "Schaufensterfolie"], ["Nicht wichtig und nicht dringend", "Altbestand sichten"]], [])
        }
      },
      software: {
        company: "Nordkap",
        tiles: {
          finance: tile("finance", "Finance", "310.000 €", "Liquide Mittel", "−18.000 €", "down", "310.000 € liquide Mittel, 18.000 € unter dem Vormonat."),
          tickets: tile("tickets", "Tickets & Probleme", "11", "Überfällige Fälle", "4 seit gestern", "", "11 Supportfälle sind über der Antwortfrist. 1 Problem ist kritisch: die API antwortet seit 40 Minuten mit Fehlern.", { value: "1", metric: "Kritisch und offen", delta: "API seit 40 Minuten", sign: "down" }),
          social: tile("social", "Social Media", "62.000", "Reichweite, 7 Tage", "+6 %", "up", "Reichweite der letzten 7 Tage: 62.000, auf der LinkedIn-Seite."),
          conversion: tile("conversion", "Conversion", "17 %", "Test zu zahlend", "+1 Punkt", "up", "17 % der Testkonten wurden zahlend. 31 von 180."),
          retention: tile("retention", "Retention", "94 %", "Noch zahlend nach 90 Tagen", "−1 Punkt", "down", "94 % der zahlenden Kunden zahlen nach 90 Tagen noch."),
          messages: tile("messages", "Nachrichten", "9", "Ungelesen", "3 Konten", "", "9 Nachrichten sind ungelesen."),
          management: tile("management", "Management", "7", "Überfällige Aufgaben", "älteste 6 Tage", "", "7 delegierte Aufgaben sind über der Frist."),
          todo: tile("todo", "To-do", "2", "Wichtig und dringend", "von 8 Punkten", "", "2 eigene Punkte sind wichtig und dringend.")
        },
        sheets: {
          finance: sheet(["Posten", "Betrag"], [["Geschäftskonto", "310.000 €"], ["Löhne, diese Woche", "42.000 €"], ["Hosting, diese Woche", "1.800 €"]], [1]),
          tickets: sheet(["Fall", "Frist", "Kanal"], [["Login, API-Fehler", "3 Stunden über", "Support"], ["Export bricht ab", "1 Tag über", "Support"], ["Rechnung Holm", "heute", "Firma"], ["Testkonto ohne Mail", "2 Tage über", "Support"]], []),
          problems: sheet(["Quelle", "Sache"], [["Produkt", "API antwortet seit 40 Minuten mit Fehlern"]], []),
          social: sheet(["Kanal", "Reichweite"], [["LinkedIn", "62.000"]], [1]),
          conversion: sheet(["Stufe", "Anzahl"], [["Testkonten", "180"], ["Aktiviert", "96"], ["Zahlend", "31"]], [1]),
          retention: sheet(["Kohorte", "Noch zahlend"], [["Juli", "96 %"], ["August", "94 %"], ["September", "94 %"]], [1]),
          messages: sheet(["Konto", "Von", "Inhalt"], [["Support", "Kunde Holm", "Export bricht ab"], ["Firma", "Steuerbüro", "Lohnunterlagen"], ["Intern", "Mira", "Fix liegt auf Staging"]], []),
          management: sheet(["Aufgabe", "Person", "Status"], [["API-Fix", "Mira", "Angefangen"], ["Kundeninfo Holm", "Jonas", "Ausstehend"], ["Lohn freigeben", "Jonas", "Ausstehend"], ["Staging prüfen", "Mira", "Beendet"]], []),
          todo: sheet(["Feld", "Punkt"], [["Wichtig und dringend", "API-Lage entscheiden"], ["Wichtig und dringend", "Lohn freigeben"], ["Wichtig und nicht dringend", "Preisliste Q4"], ["Nicht wichtig und dringend", "Statusseite aktualisieren"]], [])
        }
      },
      event: {
        company: "Atelier Süd",
        tiles: {
          finance: tile("finance", "Finance", "96.500 €", "Liquide Mittel", "+8.400 €", "up", "96.500 € liquide Mittel, 8.400 € über dem Vormonat."),
          tickets: tile("tickets", "Tickets & Probleme", "4", "Überfällige Fälle", "1 seit gestern", "", "4 Rückfragen sind über der Frist. 3 Probleme sind kritisch. Location und Licht betreffen diese Woche.", { value: "3", metric: "Kritisch und offen", delta: "2 betreffen diese Woche", sign: "" }),
          social: tile("social", "Social Media", "41.000", "Reichweite, 7 Tage", "−4 %", "down", "Reichweite der letzten 7 Tage: 41.000."),
          conversion: tile("conversion", "Conversion", "26 %", "Anfrage zu Mandat", "+2 Punkte", "up", "26 % der Anfragen wurden ein Mandat. 5 von 19."),
          retention: tile("retention", "Retention", "48 %", "Folgemandat in 12 Monaten", "+3 Punkte", "up", "48 % der Auftraggeber haben in 12 Monaten ein weiteres Mandat erteilt."),
          messages: tile("messages", "Nachrichten", "22", "Ungelesen", "3 Konten", "", "22 Nachrichten sind ungelesen."),
          management: tile("management", "Management", "8", "Überfällige Aufgaben", "älteste 2 Tage", "", "8 delegierte Aufgaben sind über der Frist."),
          todo: tile("todo", "To-do", "4", "Wichtig und dringend", "von 15 Punkten", "", "4 eigene Punkte sind wichtig und dringend.")
        },
        sheets: {
          finance: sheet(["Posten", "Betrag"], [["Geschäftskonto", "96.500 €"], ["Offene Fremdkosten", "18.200 €"], ["Beauftragtes Honorar", "64.000 €"]], [1]),
          tickets: sheet(["Fall", "Frist", "Kanal"], [["Location Hafen", "1 Tag über", "Auftraggeber"], ["Technikrider Linde", "heute", "Gewerk"], ["Gästeliste Körner", "2 Tage über", "Auftraggeber"], ["Anzahl Scheinwerfer", "heute", "Gewerk"]], []),
          problems: sheet(["Quelle", "Sache"], [["Location", "Hafen sagt Donnerstag ab"], ["Technik", "Licht noch unbestätigt"], ["Personal", "Eine Schicht am Freitag offen"]], []),
          social: sheet(["Kanal", "Reichweite"], [["Instagram", "28.000"], ["LinkedIn", "13.000"]], [1]),
          conversion: sheet(["Stufe", "Anzahl"], [["Anfragen", "19"], ["Angebote", "11"], ["Mandate", "5"]], [1]),
          retention: sheet(["Jahrgang", "Folgemandat"], [["2024", "44 %"], ["2025", "48 %"]], [1]),
          messages: sheet(["Konto", "Von", "Inhalt"], [["Auftraggeber", "Linde", "Rider fehlt noch"], ["Gewerk", "Lichtwerk", "Zwei Scheinwerfer offen"], ["Intern", "Nora", "Schichtplan liegt bereit"]], []),
          management: sheet(["Aufgabe", "Person", "Status"], [["Location ersetzen", "Nora", "Angefangen"], ["Licht bestätigen", "Paul", "Ausstehend"], ["Schicht Freitag", "Nora", "Ausstehend"], ["Rider an Linde", "Paul", "Beendet"]], []),
          todo: sheet(["Feld", "Punkt"], [["Wichtig und dringend", "Location heute entscheiden"], ["Wichtig und dringend", "Licht freigeben"], ["Wichtig und dringend", "Schicht Freitag besetzen"], ["Wichtig und dringend", "Linde den Rider schicken"], ["Wichtig und nicht dringend", "Herbstmappe"]], [])
        }
      }
    };

    let pack = "buch";
    let view = "home";
    const messages = [];

    const stage = document.getElementById("stage");
    const thread = document.getElementById("thread");
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const rail = document.getElementById("rail");
    const backdrop = document.getElementById("backdrop");
    document.getElementById("dateline").textContent = new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function dash() { return DATA[pack]; }

    function heute(d) {
      const todo = d.tiles.todo.value === "1" ? "1 Punkt ist wichtig und dringend." : d.tiles.todo.value + " Punkte sind wichtig und dringend.";
      const tickets = d.tiles.tickets.value === "1" ? "1 Fall ist über der Frist." : d.tiles.tickets.value + " Fälle sind über der Frist.";
      const problems = d.tiles.tickets.also.value === "1" ? "1 Problem ist kritisch." : d.tiles.tickets.also.value + " Probleme sind kritisch.";
      return todo + " " + tickets + " " + problems;
    }

    function answerFor(text) {
      const d = dash();
      const q = text.toLowerCase();
      const hit = (words) => words.some((word) => q.includes(word));
      if (hit(["finanz", "geld", "liquid", "kasse", "konto"])) return d.tiles.finance.line;
      if (hit(["ticket", "fall", "support", "frist", "problem", "störung", "liefer", "server", "api", "location"])) return d.tiles.tickets.line;
      if (hit(["social", "reichweite", "instagram", "linkedin", "facebook"])) return d.tiles.social.line;
      if (hit(["conversion", "abschluss", "kauf", "test", "anfrage", "mandat"])) return d.tiles.conversion.line;
      if (hit(["retention", "bindung", "zweit", "folge"])) return d.tiles.retention.line;
      if (hit(["nachricht", "mail", "ungelesen", "post"])) return d.tiles.messages.line;
      if (hit(["management", "aufgabe", "team", "deleg"])) return d.tiles.management.line;
      if (hit(["todo", "to-do", "eisenhower", "matrix", "wichtig"])) return d.tiles.todo.line;
      if (view !== "home") return d.tiles[view].line;
      return heute(d);
    }

    function renderNav() {
      document.querySelectorAll(".nav-btn").forEach((link) => {
        const id = link.getAttribute("href").slice(1);
        if (id === view) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
      document.querySelectorAll("[data-pack]").forEach((button) => {
        button.setAttribute("aria-selected", button.dataset.pack === pack ? "true" : "false");
      });
      document.getElementById("company").textContent = dash().company;
      document.getElementById("top-company").textContent = dash().company;
      const place = view === "home" ? "zum Unternehmen" : "zu " + dash().tiles[view].category;
      msg.placeholder = "Nachricht " + place;
    }

    function metricBlock(item) {
      const sign = item.sign ? " " + item.sign : "";
      return '<span><span class="tile-value">' + esc(item.value) + "</span>" +
        '<span class="tile-meta"><span>' + esc(item.metric) + '</span><span class="' + sign.trim() + '">' + esc(item.delta) + "</span></span></span>";
    }

    function renderTile(item) {
      if (item.also) {
        return '<a class="tile" href="#' + item.id + '">' +
          '<span class="tile-cat"><span class="tile-group">' + esc(GROUPS[item.id]) + "</span>" + esc(item.category) + "</span>" +
          '<span class="pair">' + metricBlock(item) + metricBlock(item.also) + "</span></a>";
      }
      return '<a class="tile" href="#' + item.id + '">' +
        '<span class="tile-cat"><span class="tile-group">' + esc(GROUPS[item.id]) + "</span>" + esc(item.category) + "</span>" +
        metricBlock(item) +
        (item.id === "finance" ? '<span class="tile-dek">' + esc(item.line) + "</span>" : "") +
        "</a>";
    }

    function tableHtml(table) {
      const head = table.headers.map((header, index) => '<th class="' + (table.numeric.includes(index) ? "num" : "") + '">' + esc(header) + "</th>").join("");
      const body = table.rows.map((row) => "<tr>" + row.map((cell, index) => '<td class="' + (table.numeric.includes(index) ? "num" : "") + '">' + esc(cell) + "</td>").join("") + "</tr>").join("");
      return "<table><thead><tr>" + head + "</tr></thead><tbody>" + body + "</tbody></table>";
    }

    function renderSheet(item) {
      const sign = item.sign ? " " + item.sign : "";
      if (item.also) {
        const alsoSign = item.also.sign ? " " + item.also.sign : "";
        return '<article class="sheet"><p class="sheet-kicker">' + esc(GROUPS[item.id]) + "</p><h1>" + esc(item.category) + "</h1>" +
          '<p class="sheet-dek">' + esc(item.line) + "</p>" +
          '<div class="pair"><span><p class="sheet-value">' + esc(item.value) + '</p><p class="sheet-metric">' + esc(item.metric) + ' · <span class="' + sign.trim() + '">' + esc(item.delta) + "</span></p></span>" +
          '<span><p class="sheet-value">' + esc(item.also.value) + '</p><p class="sheet-metric">' + esc(item.also.metric) + ' · <span class="' + alsoSign.trim() + '">' + esc(item.also.delta) + "</span></p></span></div>" +
          "<h2 class=\"sheet-kicker\">Tickets</h2>" + tableHtml(dash().sheets.tickets) +
          "<h2 class=\"sheet-kicker\">Probleme</h2>" + tableHtml(dash().sheets.problems) +
          "</article>";
      }
      return '<article class="sheet"><p class="sheet-kicker">' + esc(GROUPS[item.id]) + "</p><h1>" + esc(item.category) + "</h1>" +
          '<p class="sheet-dek">' + esc(item.line) + "</p>" +
        '<p class="sheet-value">' + esc(item.value) + "</p>" +
        '<p class="sheet-metric">' + esc(item.metric) + ' · <span class="' + sign.trim() + '">' + esc(item.delta) + "</span></p>" +
        tableHtml(dash().sheets[item.id]) + "</article>";
    }

    function renderStage() {
      const d = dash();
      if (view === "home") {
        stage.innerHTML = '<h1 class="sr">Übersicht</h1><div class="grid">' + ORDER.map((id) => renderTile(d.tiles[id])).join("") + "</div>";
      } else {
        stage.innerHTML = renderSheet(d.tiles[view]);
      }
      renderNav();
    }

    function renderThread() {
      thread.innerHTML = messages.map((entry) => '<div class="msg-' + entry.role + '">' + esc(entry.text) + "</div>").join("");
      thread.scrollTop = thread.scrollHeight;
    }

    function applyHash() {
      let id = location.hash.slice(1);
      if (id === "problems") id = "tickets";
      view = id && dash().tiles[id] ? id : "home";
      renderStage();
      closeMenu();
    }

    function closeMenu() {
      rail.classList.remove("open");
      backdrop.classList.remove("show");
    }

    function submitText(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      messages.push({ role: "user", text: trimmed });
      messages.push({ role: "agent", text: answerFor(trimmed) });
      msg.value = "";
      fit();
      sendBtn.disabled = true;
      renderThread();
    }

    function fit() {
      msg.style.height = "auto";
      msg.style.height = Math.min(msg.scrollHeight, 110) + "px";
    }

    window.addEventListener("hashchange", applyHash);
    document.addEventListener("click", (event) => {
      const packBtn = event.target.closest("[data-pack]");
      if (!packBtn) return;
      pack = packBtn.dataset.pack;
      messages.length = 0;
      renderThread();
      renderStage();
    });

    document.getElementById("menu").addEventListener("click", () => {
      rail.classList.toggle("open");
      backdrop.classList.toggle("show", rail.classList.contains("open"));
    });
    backdrop.addEventListener("click", closeMenu);

    msg.addEventListener("input", () => {
      sendBtn.disabled = msg.value.trim().length === 0;
      fit();
    });
    msg.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        submitText(msg.value);
      }
    });
    document.getElementById("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      submitText(msg.value);
    });

    const Mic = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById("mic");
    if (Mic) {
      const rec = new Mic();
      rec.lang = "de-DE";
      rec.onresult = (event) => {
        msg.value = event.results[0][0].transcript;
        sendBtn.disabled = msg.value.trim().length === 0;
        fit();
        micBtn.setAttribute("aria-pressed", "false");
      };
      rec.onend = () => micBtn.setAttribute("aria-pressed", "false");
      micBtn.addEventListener("click", () => {
        if (micBtn.getAttribute("aria-pressed") === "true") {
          rec.stop();
          return;
        }
        micBtn.setAttribute("aria-pressed", "true");
        rec.start();
      });
    } else {
      micBtn.addEventListener("click", () => msg.focus());
    }

    applyHash();
  </script>
</body>
</html>
