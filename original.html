<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>unc</title>
  <style>
    :root {
      --bg: #e8e2d8;
      --rail: #f3efe8;
      --paper: #f7f4ee;
      --card: #fffcf8;
      --ink: #1c1b19;
      --muted: #6f6a62;
      --faint: #8a847b;
      --line: #ddd6cb;
      --line-strong: #c9c1b4;
      --good: #1d6b43;
      --bad: #9a4034;
      --radius: 16px;
      --sans: "SF Pro Text", "SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--bg);
      font-size: 15px;
      line-height: 1.4;
    }
    button, textarea { font: inherit; color: inherit; }
    button, a.nav-btn, a.tile { cursor: pointer; }
    a.nav-btn, a.tile { text-decoration: none; color: inherit; }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .app {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      min-height: 100%;
    }

    .rail {
      background: var(--rail);
      border-right: 1px solid var(--line);
      padding: 22px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .brand { padding: 0 8px; }
    .brand-kicker {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .brand-name {
      margin: 4px 0 0;
      font-size: 18px;
      font-weight: 590;
      letter-spacing: -0.02em;
    }
    .seg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding: 2px;
      margin-top: 12px;
      background: #e6e0d6;
      border-radius: 10px;
    }
    .seg button {
      border: 0;
      background: transparent;
      border-radius: 8px;
      padding: 6px 2px;
      font-size: 11px;
      color: var(--muted);
    }
    .seg button[aria-selected="true"] {
      background: var(--card);
      color: var(--ink);
      font-weight: 590;
    }

    nav { display: flex; flex-direction: column; gap: 14px; }
    .group { display: flex; flex-direction: column; gap: 2px; }
    .group-label {
      margin: 0 8px 4px;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .nav-btn {
      display: flex;
      align-items: center;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 14px;
      color: var(--ink);
    }
    .nav-btn:hover { background: rgba(28, 27, 25, 0.05); }
    .nav-btn[aria-current="page"] {
      background: var(--ink);
      color: var(--paper);
    }

    .note {
      margin-top: auto;
      padding: 0 8px;
      font-size: 12px;
      color: var(--faint);
    }

    main {
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .menu-btn {
      border: 1px solid var(--line-strong);
      background: var(--card);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
    }
    .stage {
      padding: 28px 28px 32px;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      align-items: stretch;
      max-width: 1080px;
      margin: 0 auto;
    }
    .frame { min-width: 0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: minmax(150px, auto);
      grid-auto-flow: dense;
      gap: 12px;
    }
    .tile {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 168px;
      padding: 16px 16px 14px;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .tile:hover { border-color: var(--line-strong); background: #fff; }
    .tile-cat {
      font-size: 16px;
      font-weight: 590;
      letter-spacing: -0.01em;
    }
    .tile-value {
      margin-top: 28px;
      font-size: 32px;
      line-height: 1.05;
      font-weight: 560;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .tile-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 22px;
    }
    .pair .tile-value { margin-top: 0; font-size: 28px; }
    .pair .tile-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .tile-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .tile-change {
      flex: none;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(28, 27, 25, 0.06);
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .tile-l { grid-column: span 2; grid-row: span 2; }
    .tile-l .tile-value { font-size: 52px; }
    .tile-m { grid-column: span 2; }
    .tile-s { padding: 14px 14px 12px; }
    .tile-s .tile-cat { font-size: 14px; }
    .tile-s .tile-head { flex-wrap: wrap; row-gap: 4px; }
    .tile-s .tile-value { margin-top: 18px; font-size: 24px; }
    .tile-s .tile-meta { flex-direction: column; gap: 2px; font-size: 12px; }
    .tile-s .pair { grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }
    .tile-s .pair .tile-value { font-size: 22px; }
    .up { color: var(--good); }
    .down { color: var(--bad); }

    .sheet-kicker {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .sheet h1 {
      margin: 6px 0 0;
      font-size: 28px;
      font-weight: 590;
      letter-spacing: -0.03em;
    }
    .sheet-value {
      margin: 22px 0 0;
      font-size: 44px;
      line-height: 1;
      font-weight: 560;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .sheet h2.sheet-kicker { margin: 26px 0 0; }
    .sheet .pair .sheet-value { font-size: 36px; }
    table {
      width: 100%;
      margin-top: 28px;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      font-size: 12px;
      font-weight: 500;
      color: var(--faint);
      padding: 0 0 8px;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 12px 16px 12px 0;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }

    .chat-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      min-height: 640px;
      overflow: hidden;
    }
    .chat-head {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      font-weight: 590;
    }
    .thread {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: auto;
      padding: 16px;
    }
    .msg-user {
      align-self: flex-end;
      max-width: 72%;
      background: #e7e1d7;
      border-radius: 16px;
      padding: 8px 12px;
    }
    .msg-agent {
      align-self: flex-start;
      max-width: 72%;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      margin-top: auto;
      background: var(--card);
      border: 0;
      border-top: 1px solid var(--line);
      border-radius: 0;
      padding: 10px 10px 10px 14px;
    }
    textarea {
      flex: 1;
      border: 0;
      resize: none;
      background: transparent;
      padding: 10px 0;
      line-height: 22px;
      max-height: 110px;
      min-height: 42px;
    }
    textarea::placeholder { color: var(--faint); }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: var(--ink);
      display: grid;
      place-items: center;
      flex: none;
    }
    .icon-btn:hover { background: rgba(28, 27, 25, 0.06); }
    .icon-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    #send {
      background: var(--ink);
      color: var(--paper);
    }
    #send:disabled { opacity: 0.28; }
    .icon-btn svg { width: 16px; height: 16px; display: block; }

    .backdrop {
      display: none;
    }

    @media (max-width: 1240px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile-l, .tile-m { grid-column: span 2; grid-row: auto; }
      .tile-l { min-height: 220px; }
    }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .topbar { display: flex; }
      .rail {
        position: fixed;
        z-index: 4;
        width: min(300px, 88vw);
        transform: translateX(-105%);
        transition: transform 160ms ease;
      }
      .rail.open { transform: none; }
      .backdrop.show {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(28, 27, 25, 0.28);
        z-index: 3;
      }
      .stage { padding-left: 16px; padding-right: 16px; }
      .workspace { grid-template-columns: 1fr; }
      .chat-panel { min-height: 520px; margin-top: 8px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile { min-height: 132px; }
      .tile-value { margin-top: 16px; font-size: 28px; }
      .tile-l { min-height: 200px; }
      .tile-l .tile-value { font-size: 40px; }
      .sheet-value { font-size: 36px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rail { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="brand.css">
  <script src="brand.js" defer></script>
  <script src="bridge.js" defer></script>
</head>
<body data-versions>
  <div class="app">
    <aside class="rail" id="rail">

        <div class="seg" role="tablist" aria-label="Betrieb">
          <button type="button" role="tab" data-pack="buch" aria-selected="true">Buchladen</button>
          <button type="button" role="tab" data-pack="software" aria-selected="false">Software</button>
          <button type="button" role="tab" data-pack="event" aria-selected="false">Event</button>
        </div>

      <nav aria-label="Bereiche">

          <a class="nav-btn" href="#social">Social Media</a>
          <a class="nav-btn" href="#conversion">Conversion</a>

        <div class="group">
          <p class="group-label">Handeln</p>
          <a class="nav-btn" href="#messages">Nachrichten</a>
          <a class="nav-btn" href="#management">Management</a>
          <a class="nav-btn" href="#todo">To-do</a>
        </div>
      </nav>
      <p class="note">Beispieldaten</p>
      <button class="om-sound" type="button" data-om-sound data-on="Klang an" data-off="Klang aus" aria-pressed="false">Klang aus</button>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <main>
      <div class="topbar">
        <button class="menu-btn" type="button" id="menu">Menü</button>
        <span class="unc-logo" data-unc="mark" style="--unc-h: 22px"></span><strong id="top-company">Heft &amp; Bogen</strong>

      <div class="stage">
        <div class="workspace">
          <div class="frame" id="stage"></div>
          <aside class="chat-panel" aria-label="Chat">

            <button class="icon-btn" type="button" id="mic" aria-label="Mikrofon" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <rect x="6" y="1.5" width="4" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="M4 8.2a4 4 0 0 0 8 0M8 12.2v2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="icon-btn" type="submit" id="send" aria-label="Senden" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 13V3.5M8 3.5 4.2 7.2M8 3.5l3.8 3.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
          </aside>
        </div>
      </div>
    </main>
  </div>

      event: {
        company: "Atelier Süd",
        change: { finance: 0.095, tickets: 0.333, social: -0.04, conversion: 0.083, retention: 0.067, messages: 0.467, management: 0, todo: 1 },
        tiles: {
          finance: tile("finance", "Finance", "96.500 €", "Liquide Mittel", "+8.400 €", "up", "96.500 € liquide Mittel, 8.400 € über dem Vormonat."),
          tickets: tile("tickets", "Tickets & Probleme", "4", "Überfällige Fälle", "1 seit gestern", "", "4 Rückfragen sind über der Frist. 3 Probleme sind kritisch. Location und Licht betreffen diese Woche.", { value: "3", metric: "Kritisch und offen", delta: "2 betreffen diese Woche", sign: "" }),
          social: tile("social", "Social Media", "41.000", "Reichweite, 7 Tage", "−4 %", "down", "Reichweite der letzten 7 Tage: 41.000."),
          conversion: tile("conversion", "Conversion", "26 %", "Anfrage zu Mandat", "+2 Punkte", "up", "26 % der Anfragen wurden ein Mandat. 5 von 19."),
          retention: tile("retention", "Retention", "48 %", "Folgemandat in 12 Monaten", "+3 Punkte", "up", "48 % der Auftraggeber haben in 12 Monaten ein weiteres Mandat erteilt."),
          messages: tile("messages", "Nachrichten", "22", "Ungelesen", "3 Konten", "", "22 Nachrichten sind ungelesen."),
          management: tile("management", "Management", "8", "Überfällige Aufgaben", "älteste 2 Tage", "", "8 delegierte Aufgaben sind über der Frist."),
          todo: tile("todo", "To-do", "4", "Wichtig und dringend", "von 15 Punkten", "", "4 eigene Punkte sind wichtig und dringend.")
        },
        sheets: {
          finance: sheet(["Posten", "Betrag"], [["Geschäftskonto", "96.500 €"], ["Offene Fremdkosten", "18.200 €"], ["Beauftragtes Honorar", "64.000 €"]], [1]),
          tickets: sheet(["Fall", "Frist", "Kanal"], [["Location Hafen", "1 Tag über", "Auftraggeber"], ["Technikrider Linde", "heute", "Gewerk"], ["Gästeliste Körner", "2 Tage über", "Auftraggeber"], ["Anzahl Scheinwerfer", "heute", "Gewerk"]], []),
          problems: sheet(["Quelle", "Sache"], [["Location", "Hafen sagt Donnerstag ab"], ["Technik", "Licht noch unbestätigt"], ["Personal", "Eine Schicht am Freitag offen"]], []),
          social: sheet(["Kanal", "Reichweite"], [["Instagram", "28.000"], ["LinkedIn", "13.000"]], [1]),
          conversion: sheet(["Stufe", "Anzahl"], [["Anfragen", "19"], ["Angebote", "11"], ["Mandate", "5"]], [1]),
          retention: sheet(["Jahrgang", "Folgemandat"], [["2024", "44 %"], ["2025", "48 %"]], [1]),
          messages: sheet(["Konto", "Von", "Inhalt"], [["Auftraggeber", "Linde", "Rider fehlt noch"], ["Gewerk", "Lichtwerk", "Zwei Scheinwerfer offen"], ["Intern", "Nora", "Schichtplan liegt bereit"]], []),
          management: sheet(["Aufgabe", "Person", "Status"], [["Location ersetzen", "Nora", "Angefangen"], ["Licht bestätigen", "Paul", "Ausstehend"], ["Schicht Freitag", "Nora", "Ausstehend"], ["Rider an Linde", "Paul", "Beendet"]], []),
          todo: sheet(["Feld", "Punkt"], [["Wichtig und dringend", "Location heute entscheiden"], ["Wichtig und dringend", "Licht freigeben"], ["Wichtig und dringend", "Schicht Freitag besetzen"], ["Wichtig und dringend", "Linde den Rider schicken"], ["Wichtig und nicht dringend", "Herbstmappe"]], [])
        }
      }
    };

    let pack = "buch";
    let view = "home";
    const messages = [];

    const stage = document.getElementById("stage");
    const thread = document.getElementById("thread");
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("send");
    const rail = document.getElementById("rail");
    const backdrop = document.getElementById("backdrop");

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function dash() { return DATA[pack]; }

    function heute(d) {
      const todo = d.tiles.todo.value === "1" ? "1 Punkt ist wichtig und dringend." : d.tiles.todo.value + " Punkte sind wichtig und dringend.";
      const tickets = d.tiles.tickets.value === "1" ? "1 Fall ist über der Frist." : d.tiles.tickets.value + " Fälle sind über der Frist.";
      const problems = d.tiles.tickets.also.value === "1" ? "1 Problem ist kritisch." : d.tiles.tickets.also.value + " Probleme sind kritisch.";
      return todo + " " + tickets + " " + problems;
    }

    function answerFor(text) {
      const d = dash();
      const q = text.toLowerCase();
      const hit = (words) => words.some((word) => q.includes(word));
      if (hit(["finanz", "geld", "liquid", "kasse", "konto"])) return d.tiles.finance.line;
      if (hit(["ticket", "fall", "support", "frist", "problem", "störung", "liefer", "server", "api", "location"])) return d.tiles.tickets.line;
      if (hit(["social", "reichweite", "instagram", "linkedin", "facebook"])) return d.tiles.social.line;
      if (hit(["conversion", "abschluss", "kauf", "test", "anfrage", "mandat"])) return d.tiles.conversion.line;
      if (hit(["retention", "bindung", "zweit", "folge"])) return d.tiles.retention.line;
      if (hit(["nachricht", "mail", "ungelesen", "post"])) return d.tiles.messages.line;
      if (hit(["management", "aufgabe", "team", "deleg"])) return d.tiles.management.line;
      if (hit(["todo", "to-do", "eisenhower", "matrix", "wichtig"])) return d.tiles.todo.line;
      if (view !== "home") return d.tiles[view].line;
      return heute(d);
    }

    function renderNav() {
      document.querySelectorAll(".nav-btn").forEach((link) => {
        const id = link.getAttribute("href").slice(1);
        if (id === view) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
      document.querySelectorAll("[data-pack]").forEach((button) => {
        button.setAttribute("aria-selected", button.dataset.pack === pack ? "true" : "false");
      });
      document.getElementById("company").textContent = dash().company;
      document.getElementById("top-company").textContent = dash().company;
      const place = view === "home" ? "zum Unternehmen" : "zu " + dash().tiles[view].category;
      msg.placeholder = "Nachricht " + place;
    }

    function metricBlock(item) {
      const sign = item.sign ? " " + item.sign : "";
      return '<span><span class="tile-value">' + esc(item.value) + "</span>" +
        '<span class="tile-meta"><span>' + esc(item.metric) + '</span><span class="' + sign.trim() + '">' + esc(item.delta) + "</span></span></span>";
    }

    function pct(change) {
      if (change === 0) return "±0 %";
      const abs = Math.abs(change * 100);
      const text = String(abs >= 10 ? Math.round(abs) : abs.toFixed(1)).replace(".", ",");
      return (change > 0 ? "+" : "−") + text + " %";
    }

    function renderTile(item, size, change) {
      const head = '<span class="tile-head"><span class="tile-cat">' + esc(item.category) + "</span>" +
        '<span class="tile-change">' + pct(change) + "</span></span>";
      if (item.also) {
        return '<a class="tile tile-' + size + '" href="#' + item.id + '">' + head +
          '<span class="pair">' + metricBlock(item) + metricBlock(item.also) + "</span></a>";
      }
      return '<a class="tile tile-' + size + '" href="#' + item.id + '">' + head +
        metricBlock(item) +
        "</a>";
    }

    function tableHtml(table) {
      const head = table.headers.map((header, index) => '<th class="' + (table.numeric.includes(index) ? "num" : "") + '">' + esc(header) + "</th>").join("");
      const body = table.rows.map((row) => "<tr>" + row.map((cell, index) => '<td class="' + (table.numeric.includes(index) ? "num" : "") + '">' + esc(cell) + "</td>").join("") + "</tr>").join("");
      return "<table><thead><tr>" + head + "</tr></thead><tbody>" + body + "</tbody></table>";
    }

    function renderSheet(item) {
      const sign = item.sign ? " " + item.sign : "";
      if (item.also) {
        const alsoSign = item.also.sign ? " " + item.also.sign : "";
        return '<article class="sheet"><p class="sheet-kicker">' + esc(GROUPS[item.id]) + "</p><h1>" + esc(item.category) + "</h1>" +
          '<div class="pair"><span><p class="sheet-value">' + esc(item.value) + '</p><p class="sheet-metric">' + esc(item.metric) + ' · <span class="' + sign.trim() + '">' + esc(item.delta) + "</span></p></span>" +
          '<span><p class="sheet-value">' + esc(item.also.value) + '</p><p class="sheet-metric">' + esc(item.also.metric) + ' · <span class="' + alsoSign.trim() + '">' + esc(item.also.delta) + "</span></p></span></div>" +
          "<h2 class=\"sheet-kicker\">Tickets</h2>" + tableHtml(dash().sheets.tickets) +
          "<h2 class=\"sheet-kicker\">Probleme</h2>" + tableHtml(dash().sheets.problems) +
          "</article>";
      }
      return '<article class="sheet"><p class="sheet-kicker">' + esc(GROUPS[item.id]) + "</p><h1>" + esc(item.category) + "</h1>" +
        '<p class="sheet-value">' + esc(item.value) + "</p>" +
        '<p class="sheet-metric">' + esc(item.metric) + ' · <span class="' + sign.trim() + '">' + esc(item.delta) + "</span></p>" +
        tableHtml(dash().sheets[item.id]) + "</article>";
    }

    function renderStage() {
      const d = dash();
      if (view === "home") {
        const ranked = ORDER.slice().sort((a, b) => Math.abs(d.change[b]) - Math.abs(d.change[a]));
        const size = (rank) => (rank < 2 ? "l" : rank < 4 ? "m" : "s");
        stage.innerHTML = '<h1 class="sr">Übersicht</h1><div class="grid">' +
          ranked.map((id, rank) => renderTile(d.tiles[id], size(rank), d.change[id])).join("") + "</div>";
      } else {
        stage.innerHTML = renderSheet(d.tiles[view]);
      }
      renderNav();
    }

    function renderThread() {
      thread.innerHTML = messages.map((entry) => '<div class="msg-' + entry.role + '">' + esc(entry.text) + "</div>").join("");
      thread.scrollTop = thread.scrollHeight;
    }

    function applyHash() {
      let id = location.hash.slice(1);
      if (id === "problems") id = "tickets";
      view = id && dash().tiles[id] ? id : "home";
      renderStage();
      closeMenu();
    }

    function closeMenu() {
      rail.classList.remove("open");
      backdrop.classList.remove("show");
    }

    function submitText(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      messages.push({ role: "user", text: trimmed });
      messages.push({ role: "agent", text: answerFor(trimmed) });
      msg.value = "";
      fit();
      sendBtn.disabled = true;
      renderThread();
    }

    function fit() {
      msg.style.height = "auto";
      msg.style.height = Math.min(msg.scrollHeight, 110) + "px";
    }

    window.addEventListener("hashchange", applyHash);
    document.addEventListener("click", (event) => {
      const packBtn = event.target.closest("[data-pack]");
      if (!packBtn) return;
      pack = packBtn.dataset.pack;
      messages.length = 0;
      renderThread();
      renderStage();
    });

    document.getElementById("menu").addEventListener("click", () => {
      rail.classList.toggle("open");
      backdrop.classList.toggle("show", rail.classList.contains("open"));
    });
    backdrop.addEventListener("click", closeMenu);

    msg.addEventListener("input", () => {
      sendBtn.disabled = msg.value.trim().length === 0;
      fit();
    });
    msg.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        submitText(msg.value);
      }
    });
    document.getElementById("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      submitText(msg.value);
    });

    const Mic = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById("mic");
    if (Mic) {
      const rec = new Mic();
      rec.lang = "de-DE";
      rec.onresult = (event) => {
        msg.value = event.results[0][0].transcript;
        sendBtn.disabled = msg.value.trim().length === 0;
        fit();
        micBtn.setAttribute("aria-pressed", "false");
      };
      rec.onend = () => micBtn.setAttribute("aria-pressed", "false");
      micBtn.addEventListener("click", () => {
        if (micBtn.getAttribute("aria-pressed") === "true") {
          rec.stop();
          return;
        }
        micBtn.setAttribute("aria-pressed", "true");
        rec.start();
      });
    } else {
      micBtn.addEventListener("click", () => msg.focus());
    }

    applyHash();
  </script>
</body>
</html>
